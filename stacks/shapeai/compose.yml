# Shape AI: treino, dieta e evolução com IA (Hermes dos produtos), gamificado. Hormônios: a IA explica e lê a receita do médico (visão), não prescreve.
# Estado em /opt/platform/data/shapeai (SQLite). Segredos em /opt/platform/secrets/shapeai.env (workflow shapeai-segredos.yml).
# Camada B. Deploy: deploy.yml (service=shapeai).
name: shapeai
services:
  web:
    image: ${SHAPEAI_IMAGE:?imagem definida pelo scripts/deploy.sh a partir de releases/shapeai.lock}
    container_name: shapeai
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    env_file:
      - /opt/platform/secrets/shapeai.env
      - /opt/platform/secrets/rt-admin.env   # login do painel /admin (igual em todos os produtos)
    environment:
      SHAPEAI_DADOS: /data
      SHAPEAI_DEMO_EMAIL: demo@rangeltech.net
      SHAPEAI_LLM_BASE: http://rt-hermes-produtos:8642/v1   # toda IA dos produtos passa pelo Hermes (Lucas, 16/11)
      SHAPEAI_LLM_MODELO: hermes-produtos
      SHAPEAI_VISAO_MODELO: visao   # leitura da foto da receita (llm-access)
      SHAPEAI_BASE_URL: https://shape.rangeltech.net
      SHAPEAI_LANCAMENTO_ATE: '2026-12-15'
    volumes:
      - /opt/platform/data/shapeai:/data
    mem_limit: 512m
    cpus: 1
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [public, internal]
    labels:
      - rt.service=shapeai
      - rt.layer=B
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.services.shapeai.loadbalancer.server.port=8000
      - traefik.http.routers.shapeai.rule=Host(`shape.rangeltech.net`) || Host(`shape-ai.rangeltech.net`)
      - traefik.http.routers.shapeai.entrypoints=websecure
      - traefik.http.routers.shapeai.tls.certresolver=letsencrypt
      - traefik.http.routers.shapeai.service=shapeai
networks:
  public:
    external: true
  internal:
    external: true
