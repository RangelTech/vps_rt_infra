# Perfilai (spec 43): plano de Instagram com IA (diretor GPT + redator Qwen). FastAPI + Pillow, imagem por release do repo RangelTech/perfilai.
# Estado em /opt/platform/data/perfilai (SQLite; entra no backup). Segredos em /opt/platform/secrets/perfilai.env
# (PERFILAI_LLM_KEY, PERFILAI_SEGREDO_SESSAO, SMTP_*, PERFILAI_CAKTO_SEGREDO, PERFILAI_CHECKOUT_MENSAL), gravados pelo workflow perfilai-segredos.yml.
# Camada B. Deploy: workflow deploy.yml (service=perfilai).
name: perfilai
services:
  web:
    image: ${PERFILAI_IMAGE:?imagem definida pelo scripts/deploy.sh a partir de releases/perfilai.lock}
    container_name: perfilai
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    env_file: /opt/platform/secrets/perfilai.env
    environment:
      PERFILAI_PN_URL: http://perfil-navegador:8000
      PERFILAI_DADOS: /data
      PERFILAI_DEMO_EMAIL: demo@rangeltech.net
      PERFILAI_LLM_MODELO: rt-geral
      PERFILAI_HERMES_BASE: http://rt-hermes-produtos:8642/v1   # redator pelo Hermes (Lucas, 16/11)
      PERFILAI_BASE_URL: https://perfilai.rangeltech.net
      PERFILAI_CHECKOUTS: '{"start": "https://pay.cakto.com.br/fkr2mv7", "pro": "https://pay.cakto.com.br/m3uexex", "turbo": "https://pay.cakto.com.br/98gigp3", "face:start": "https://pay.cakto.com.br/3pz5u6i", "face:pro": "https://pay.cakto.com.br/f3y563f", "face:turbo": "https://pay.cakto.com.br/oymittu", "tiktok:start": "https://pay.cakto.com.br/zedxs4h", "tiktok:pro": "https://pay.cakto.com.br/38iuxcv", "tiktok:turbo": "https://pay.cakto.com.br/o3ihots", "linkedin:start": "https://pay.cakto.com.br/34m326b", "linkedin:pro": "https://pay.cakto.com.br/wcmtu28", "linkedin:turbo": "https://pay.cakto.com.br/33e3y83"}'
      PERFILAI_PLANOS_CAKTO: '{"82f8ddfd-bd79-4cfc-8835-f51e104ea2e3": "start", "95a050fb-1129-48f3-be71-2ba755038e52": "pro", "c5641842-f8ca-4c6b-aced-02a10b15e6a2": "turbo", "882af38d-8805-462e-af72-7681f07b52e9": "face:start", "4ef89bc4-3545-4c1c-ab69-f5aae50fc032": "face:pro", "9e305b64-8dd7-4099-991c-035524df17fe": "face:turbo", "d3f60c2d-e1f7-4a3a-95c8-a84fe248aab8": "tiktok:start", "bdcb3564-a40b-4cb0-be84-cd7b622f7659": "tiktok:pro", "06e85846-2aca-4c38-9c98-5244f0e30228": "tiktok:turbo", "a6caef09-2936-4c58-93a4-21fdba284eb5": "linkedin:start", "533c6a90-d1b6-44fa-9dee-4afa901f66f4": "linkedin:pro", "44dd476c-702c-4445-836a-686d49160772": "linkedin:turbo"}'
      PERFILAI_LANCAMENTO_ATE: '2026-11-30'
    volumes:
      - /opt/platform/data/perfilai:/data
    mem_limit: 768m
    cpus: 1
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [public, internal]
    labels:
      - rt.service=perfilai
      - rt.layer=B
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.services.perfilai.loadbalancer.server.port=8000
      - traefik.http.routers.perfilai.rule=Host(`perfilai.rangeltech.net`) || Host(`insta-ai.rangeltech.net`) || Host(`face-ai.rangeltech.net`) || Host(`tittok-ai.rangeltech.net`) || Host(`linkdn-ai.rangeltech.net`)
      - traefik.http.routers.perfilai.entrypoints=websecure
      - traefik.http.routers.perfilai.tls.certresolver=letsencrypt
      - traefik.http.routers.perfilai.service=perfilai
networks:
  public:
    external: true
  internal:
    external: true
