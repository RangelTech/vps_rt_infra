# Stack do kernel-harness (Camada A). Imagem vem do artefato da release (ver scripts/deploy.sh); nunca build aqui.
name: kernel-harness
services:
  harness:
    image: ${KERNEL_HARNESS_IMAGE:?imagem definida pelo scripts/deploy.sh a partir de releases/kernel-harness.lock}
    container_name: kernel-harness
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.5
    networks: [harness]
    labels:
      - rt.service=kernel-harness
      - rt.layer=A
networks:
  harness:
    name: kernel-harness-net
