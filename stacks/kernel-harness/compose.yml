# Stack do kernel-harness (spec 04): kernel (API/fila/broker) + pool de workers Hermes.
# Imagens vem dos artefatos das releases (scripts/deploy.sh); nunca build aqui.
#   KERNEL_HARNESS_IMAGE  <- releases/kernel-harness.lock  (servico kernel-harness)
#   RT_HERMES_IMAGE       <- releases/rt-hermes.lock        (servico rt-hermes)
# Segredos: /opt/platform/secrets/kernel-harness.env (kernel) e rt-hermes.env (workers), 0600.
# Primeira subida: docker compose --profile init run --rm init-home  (uma vez; recria so se a config base mudar).
# Isolamento: workers ficam em redes `internal: true` (sem internet): so falam com o kernel (broker) e com o gateway de LLM (llm-gateway).
name: kernel-harness

x-hermes: &hermes
  image: ${RT_HERMES_IMAGE:?imagem definida pelo scripts/deploy.sh a partir de releases/rt-hermes.lock}
  restart: unless-stopped
  # worker efemero (kernel-harness rt_worker/): ENTRYPOINT da imagem = front + zigoto; um filho por run.
  # Sem s6 e sem gateway por perfil; PID 1 e o worker (se cair, o container sai e o Docker recria).
  init: true
  env_file: /opt/platform/secrets/rt-hermes.env
  environment:
    RT_BROKER_URL: http://kernel-harness:8080/broker/v1/call
    RT_WORKER_SLOTS: "8"
    RT_WORKER_RUN_MAX_S: "3600"
    # K-10: o processo recebe tempo para concluir runs em voo quando o deploy envia SIGTERM.
    RT_WORKER_DRAIN_MAX_S: "930"
  stop_grace_period: 930s
  user: "10000:10000"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 8g
  cpus: 4
  pids_limit: 1024   # sem s6 por perfil: PIDs = front + zigoto + filhos das runs em andamento
  tmpfs: [/tmp]
  logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  networks: [harness, llm]
  labels:
    - rt.service=rt-hermes
    - rt.layer=A
    - traefik.enable=false

services:
  # one-shot: prepara o HERMES_HOME (perfil default multiplex) de cada worker e as pastas compartilhadas
  init-home:
    image: ${RT_HERMES_IMAGE:?imagem definida pelo scripts/deploy.sh a partir de releases/rt-hermes.lock}
    user: "0"
    restart: "no"
    entrypoint: ["/opt/hermes/.venv/bin/python", "/initsrc/init_home.py"]
    env_file: /opt/platform/secrets/rt-hermes.env
    environment:
      HOMEDIRS: "/homes/1,/homes/2,/homes/3"
      LLM_URL: http://llm-gateway:20128/v1
      MAXCONC: "4"
    volumes:
      - /opt/platform/stacks/kernel-harness/init_home.py:/initsrc/init_home.py:ro
      - home1:/homes/1
      - home2:/homes/2
      - home3:/homes/3
      - profiles:/opt/data/profiles
      - tenant_skills:/skills/tenant
      - users:/srv/hermes/users
    networks: [harness]
    profiles: ["init"]

  hermes-w1:
    <<: *hermes
    container_name: rt-hermes-w1
    volumes:
      - home1:/opt/data
      - profiles:/opt/data/profiles
      - tenant_skills:/skills/tenant:ro
      - users:/srv/hermes/users:ro

  hermes-w2:
    <<: *hermes
    container_name: rt-hermes-w2
    volumes:
      - home2:/opt/data
      - profiles:/opt/data/profiles
      - tenant_skills:/skills/tenant:ro
      - users:/srv/hermes/users:ro

  hermes-w3:
    <<: *hermes
    container_name: rt-hermes-w3
    volumes:
      - home3:/opt/data
      - profiles:/opt/data/profiles
      - tenant_skills:/skills/tenant:ro
      - users:/srv/hermes/users:ro

  harness:
    image: ${KERNEL_HARNESS_IMAGE:?imagem definida pelo scripts/deploy.sh a partir de releases/kernel-harness.lock}
    container_name: kernel-harness
    restart: unless-stopped
    user: "10000:10000"
    env_file: /opt/platform/secrets/kernel-harness.env
    environment:
      BACKEND_URL: http://agent-platform-backend:8090
      LITELLM_URL: http://llm-gateway:20128
      HARNESS_WORKERS: '[{"id":"w1","url":"http://rt-hermes-w1:8642","slots":8},{"id":"w2","url":"http://rt-hermes-w2:8642","slots":8},{"id":"w3","url":"http://rt-hermes-w3:8642","slots":8}]'
      PROFILES_ROOT: /opt/data/profiles
      USERS_ROOT: /srv/hermes/users
      TENANT_SKILLS_ROOT: /skills/tenant
      # fila: 2 execucoes/tenant e expiracao de 60 s faziam o usuario ver 'Muitas solicitacoes' em picos curtos
      HARNESS_QUEUE_EXPIRY_S: "300"
      # tarefas pesadas no ambiente (instalar biblioteca, gerar planilha, consultar Metabase) passam de 120 s sem evento; antes viravam "demorou mais que o esperado"
      HARNESS_SILENCE_TIMEOUT_S: "1500"
      HARNESS_TURN_TIMEOUT_S: "2700"
      # fila de IA com GPU sob demanda (Spec 14): enquanto a GPU liga, os relogios da run pausam e o usuario ve o aviso; chave em kernel-harness.env
      HARNESS_QUEUE_STATUS_URL: http://llm-queue.rt:8000/v1/gpu/status
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.5
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    volumes:
      - profiles:/opt/data/profiles
      - tenant_skills:/skills/tenant
      - users:/srv/hermes/users
    networks: [harness, internal, dbnet, public]   # internal: Redis central (usuario ACL kernelharness, db 3)   # dbnet: fontes de dados do cliente hospedadas no Postgres da plataforma; public: egress (Mercado Pago, SMTP)
    labels:
      - rt.service=kernel-harness
      - rt.layer=A
      - traefik.enable=false

networks:
  harness:
    name: kernel-harness-net
    internal: true
  llm:
    name: kernel-harness-llm
    internal: true
  internal:
    external: true
  dbnet:
    external: true
  public:
    external: true

volumes:
  profiles: {}
  tenant_skills: {}
  users: {}
  home1: {}
  home2: {}
  home3: {}
