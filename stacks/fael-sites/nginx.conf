# <sub>.fael.rangeltech.net -> https://<sub>.rangeltech.net, com o kit do Fael injetado no HTML.
server {
  listen 8080;
  server_name ~^(?<sub>[a-z0-9-]+)\.fael\.rangeltech\.net$;
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
  client_max_body_size 200m;

  location = /__fael/saude { access_log off; return 200 "ok\n"; }
  location /__fael/ { alias /usr/share/nginx/fael/; expires 1h; }

  location / {
    set $orig "$sub.rangeltech.net";
    proxy_pass https://$orig;
    proxy_http_version 1.1;
    proxy_set_header Host $orig;
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_ssl_server_name on;
    proxy_ssl_name $orig;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_redirect https://$orig/ /;
    proxy_cookie_domain $orig $host;
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/__fael/fael.css?v=4"><script defer src="/__fael/fael.js?v=4"></script></head>';
  }
}
