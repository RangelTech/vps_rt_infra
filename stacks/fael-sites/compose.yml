# Sites "Colab Fael" (17/11/2026): cópia AO VIVO das 21 landings em <sub>.fael.rangeltech.net, sem tocar nos originais.
# nginx faz proxy para https://<sub>.rangeltech.net (login, planos e checkout continuam funcionando) e injeta
# /__fael/fael.css + fael.js: foto temática do Fael no topo e a faixa "Colab Fael - Adriano Camargo" no fim.
# Imagem pública do nginx (sem artefato próprio); conteúdo em ./www e ./nginx.conf. DNS: *.fael em terraform/dns/records.tf.
# Subir: cd /opt/platform/stacks/fael-sites && docker compose up -d
name: fael-sites
services:
  web:
    image: nginx:1.27-alpine
    container_name: fael-sites
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    mem_limit: 128m
    cpus: 0.5
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/usr/share/nginx/fael:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__fael/saude"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [public]
    labels:
      - rt.service=fael-sites
      - rt.layer=B
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.services.fael-sites.loadbalancer.server.port=8080
      - traefik.http.routers.fael-sites.rule=Host(`brain.fael.rangeltech.net`) || Host(`casa.fael.rangeltech.net`) || Host(`cortai.fael.rangeltech.net`) || Host(`anima-ai.fael.rangeltech.net`) || Host(`atende-whats.fael.rangeltech.net`) || Host(`atende-insta.fael.rangeltech.net`) || Host(`atende-face.fael.rangeltech.net`) || Host(`atende-tiktok.fael.rangeltech.net`) || Host(`posta-insta.fael.rangeltech.net`) || Host(`posta-face.fael.rangeltech.net`) || Host(`posta-tiktok.fael.rangeltech.net`) || Host(`posta-linkdn.fael.rangeltech.net`) || Host(`insta-ai.fael.rangeltech.net`) || Host(`face-ai.fael.rangeltech.net`) || Host(`tittok-ai.fael.rangeltech.net`) || Host(`linkdn-ai.fael.rangeltech.net`) || Host(`rendai.fael.rangeltech.net`) || Host(`azul.fael.rangeltech.net`) || Host(`arena.fael.rangeltech.net`) || Host(`astral.fael.rangeltech.net`) || Host(`shape.fael.rangeltech.net`)
      - traefik.http.routers.fael-sites.entrypoints=websecure
      - traefik.http.routers.fael-sites.tls.certresolver=letsencrypt
      - traefik.http.routers.fael-sites.service=fael-sites
networks:
  public:
    external: true
