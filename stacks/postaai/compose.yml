# Posta AI (spec 44 5.5): agenda e publica posts no Instagram, Facebook, TikTok e LinkedIn. Uma imagem, quatro marcas (pelo host).
# Publica pelo perfil-navegador (rede `internal`, http://perfil-navegador:8000 com POSTAAI_PN_TOKEN), que sai pelo proxy SP.
# Estado e mídia em /opt/platform/data/postaai (SQLite + arquivos dos posts).
# Segredos em /opt/platform/secrets/postaai.env (gravados pelo workflow postaai-segredos.yml). Camada B. Deploy: deploy.yml (service=postaai).
name: postaai
services:
  web:
    image: ${POSTAAI_IMAGE:?imagem definida pelo scripts/deploy.sh a partir de releases/postaai.lock}
    container_name: postaai
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    env_file: /opt/platform/secrets/postaai.env
    environment:
      POSTAAI_DADOS: /data
      POSTAAI_DEMO_EMAIL: demo@rangeltech.net
      POSTAAI_LLM_BASE: http://rt-hermes-produtos:8642/v1   # toda IA dos produtos passa pelo Hermes (Lucas, 16/11)
      POSTAAI_LLM_MODELO: hermes-produtos
      POSTAAI_BASE_URL: https://posta-ai.rangeltech.net
      POSTAAI_PN_URL: http://perfil-navegador:8000
      POSTAAI_CHECKOUTS: '{"insta:start": "https://pay.cakto.com.br/aqxvtw8", "insta:pro": "https://pay.cakto.com.br/ykzfv3c", "insta:turbo": "https://pay.cakto.com.br/5hmuvs9", "face:start": "https://pay.cakto.com.br/mg5c8jh", "face:pro": "https://pay.cakto.com.br/zssrf6n", "face:turbo": "https://pay.cakto.com.br/38rwfiw", "tiktok:start": "https://pay.cakto.com.br/34jdynq", "tiktok:pro": "https://pay.cakto.com.br/n9emy3n", "tiktok:turbo": "https://pay.cakto.com.br/8g2ectm", "linkdn:start": "https://pay.cakto.com.br/wroj3gz", "linkdn:pro": "https://pay.cakto.com.br/iqvquku", "linkdn:turbo": "https://pay.cakto.com.br/3fccq4y"}'
      POSTAAI_PLANOS_CAKTO: '{"9f11087e-6d8e-4ad9-a7f1-4e5109ffca6a": "insta:start", "a0d270de-2e3f-4b9b-9ef2-5486fb6c8511": "insta:pro", "48f085d0-46b6-4ac9-9e85-33dd536d5bef": "insta:turbo", "bdd8f94f-3ff9-4cef-9efa-89e528b71ccb": "face:start", "a7922886-adb1-4c31-9eb3-dca5286edf16": "face:pro", "edaf74c0-47ae-4057-977d-7ba2e25e8a3e": "face:turbo", "783b3f0f-7f70-4608-8906-25247c48d38e": "tiktok:start", "f05ad317-461a-40e9-9355-da2deda1b553": "tiktok:pro", "a3fc2cde-cdc5-4564-8eba-35928892a1c8": "tiktok:turbo", "156984e3-ec94-4ac5-916c-4332f6a90469": "linkdn:start", "9fb1e9d5-ba2c-41ec-a936-1faf6067678f": "linkdn:pro", "6af422bc-f513-4f9f-8c28-8d40024b5063": "linkdn:turbo"}'
      POSTAAI_LANCAMENTO_ATE: '2026-12-15'
    volumes:
      - /opt/platform/data/postaai:/data
    mem_limit: 768m
    cpus: 1
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [public, internal]
    labels:
      - rt.service=postaai
      - rt.layer=B
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.services.postaai.loadbalancer.server.port=8000
      - traefik.http.routers.postaai.rule=Host(`posta-ai.rangeltech.net`) || Host(`posta-insta.rangeltech.net`) || Host(`posta-face.rangeltech.net`) || Host(`posta-tiktok.rangeltech.net`) || Host(`posta-linkdn.rangeltech.net`)
      - traefik.http.routers.postaai.entrypoints=websecure
      - traefik.http.routers.postaai.tls.certresolver=letsencrypt
      - traefik.http.routers.postaai.service=postaai
networks:
  public:
    external: true
  internal:
    external: true
