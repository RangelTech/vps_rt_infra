# Posta AI (spec 44 5.5): agenda e publica posts no Instagram, Facebook, TikTok e LinkedIn. Uma imagem, quatro marcas (pelo host).
# Publica pelo perfil-navegador (rede `internal`, http://perfil-navegador:8000 com POSTAAI_PN_TOKEN), que sai pelo proxy SP.
# Estado e mídia em /opt/platform/data/postaai (SQLite + arquivos dos posts).
# Segredos em /opt/platform/secrets/postaai.env (gravados pelo workflow postaai-segredos.yml). Camada B. Deploy: deploy.yml (service=postaai).
name: postaai
services:
  web:
    image: ${POSTAAI_IMAGE:?imagem definida pelo scripts/deploy.sh a partir de releases/postaai.lock}
    container_name: postaai
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    env_file:
      - /opt/platform/secrets/postaai.env
      - /opt/platform/secrets/rt-admin.env   # login do painel /admin (igual em todos os produtos)
    environment:
      POSTAAI_DADOS: /data
      POSTAAI_DEMO_EMAIL: demo@rangeltech.net
      POSTAAI_LLM_BASE: http://rt-hermes-produtos:8642/v1   # toda IA dos produtos passa pelo Hermes (Lucas, 16/11)
      POSTAAI_LLM_MODELO: hermes-produtos
      POSTAAI_BASE_URL: https://posta-ai.rangeltech.net
      POSTAAI_PN_URL: http://perfil-navegador:8000
      POSTAAI_LANCAMENTO_ATE: '2026-12-15'
    volumes:
      - /opt/platform/data/postaai:/data
    mem_limit: 768m
    cpus: 1
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [public, internal]
    labels:
      - rt.service=postaai
      - rt.layer=B
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.services.postaai.loadbalancer.server.port=8000
      - traefik.http.routers.postaai.rule=Host(`posta-ai.rangeltech.net`) || Host(`posta-insta.rangeltech.net`) || Host(`posta-face.rangeltech.net`) || Host(`posta-tiktok.rangeltech.net`) || Host(`posta-linkdn.rangeltech.net`)
      - traefik.http.routers.postaai.entrypoints=websecure
      - traefik.http.routers.postaai.tls.certresolver=letsencrypt
      - traefik.http.routers.postaai.service=postaai
networks:
  public:
    external: true
  internal:
    external: true
