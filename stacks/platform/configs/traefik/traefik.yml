## Static Traefik configuration
log:
  level: INFO

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  postgres:
    address: ":5432"
  # Postgres SEM pgbouncer pela frente — pool_mode=transaction do pgbouncer
  # quebra prepared statements (checkpointer do LangGraph, psycopg). Reaberto
  # em 17/08/2026 (mega spec agent-llm): o kernel continua no Cloud Run,
  # fora da VPS, e precisa desse caminho direto pra funcionar de verdade —
  # existia antes (porta 5433, ver ADR 0001-boundaries.md do chatwoot-rt) mas
  # tinha sumido da infra-como-código, só documentado como decisão.
  postgres-direct:
    address: ":5433"
  metrics:
    address: ":8080"

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

providers:
  docker:
    exposedByDefault: false
    network: public
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # NOTE: Traefik's static config file (traefik.yml) is bind-mounted
      # read-only and is NOT processed through Docker Compose's ${VAR}
      # substitution (that substitution only applies to the compose YAML
      # itself). So this must be a real, hardcoded value rather than
      # "${LETSENCRYPT_EMAIL}", or ACME registration fails with
      # urn:ietf:params:acme:error:invalidContact.
      email: "lucas.rangel@outlook.com"
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
