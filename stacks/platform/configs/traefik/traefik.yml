## Static Traefik configuration
log:
  level: INFO

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  metrics:
    address: ":8080"

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

providers:
  docker:
    exposedByDefault: false
    network: public
  file:
    directory: /etc/traefik/dynamic.d   # 00-main.yml (dynamic.yml) + rotas por app escritas pelo runtime-manager
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # NOTE: Traefik's static config file (traefik.yml) is bind-mounted
      # read-only and is NOT processed through Docker Compose's ${VAR}
      # substitution (that substitution only applies to the compose YAML
      # itself). So this must be a real, hardcoded value rather than
      # "${LETSENCRYPT_EMAIL}", or ACME registration fails with
      # urn:ietf:params:acme:error:invalidContact.
      email: "lucas.rangel@outlook.com"
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
