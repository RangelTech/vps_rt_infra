## Dynamic Traefik configuration (spec 03, M6): so middlewares e opcoes TLS compartilhadas.
## Todos os roteadores de aplicacao vem de LABELS dos containers (stacks/*/compose.yml);
## as rotas e servicos do Cloud Run (GCP morta) foram removidos.

http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true

tls:
  options:
    default:
      minVersion: VersionTLS12
