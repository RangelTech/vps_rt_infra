# bi.rangeltech.net: interface completa do Metabase (login) + dashboards publicos embutiveis no portfolio.
# Antigo container pncp-dashboard-edge, agora um server block do nginx do portfolio (porta 8080).
limit_req_zone $binary_remote_addr zone=bi_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=bi_edge:10m rate=30r/s;
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;
    limit_req zone=bi_edge burst=80 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    set $metabase http://metabase:3000;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # tentativas de login limitadas por endereco
    location = /api/session {
        limit_req zone=bi_login burst=5 nodelay;
        proxy_pass $metabase;
    }

    # dashboards publicos e seus dados sao embutidos no portfolio
    location ^~ /public/ {
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self' https://rangeltech.net https://www.rangeltech.net" always;
        proxy_pass $metabase;
    }
    location ^~ /api/public/ {
        proxy_pass $metabase;
    }

    location / {
        proxy_pass $metabase;
    }
}
