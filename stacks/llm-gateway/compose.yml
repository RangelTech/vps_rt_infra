# Gateway LLM multitenant (Fase G). Sem porta ou rota pública: somente BFF/motor
# na rede interna acessam a API. A imagem chega pelo release/lock, nunca é criada
# na VPS. O banco e os logs vivem no volume privado incluído no backup.
name: llm-gateway
services:
  llm-gateway:
    image: ${LLM_GATEWAY_IMAGE:?imagem definida pelo scripts/deploy.sh a partir de releases/llm-gateway.lock}
    container_name: llm-gateway
    restart: unless-stopped
    env_file: /opt/platform/secrets/llm-gateway.env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      MT_STRICT: "1"
    volumes:
      - /opt/platform/data/llm-gateway:/app/data
    cap_drop: [ALL]
    # O entrypoint ajusta o dono do volume e faz o drop final para `node`.
    # Sem estas tres capabilities ele falha antes de iniciar (su-exec:setgroups).
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:20128/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [internal, public, harness_llm]   # public so para egress aos provedores (sem porta publicada); harness_llm: rede sem internet dos workers Hermes
    labels:
      - rt.service=llm-gateway
      - rt.layer=B
      # Painel (spec 11 §8.5): so o painel vai para a internet; a API de modelos (/v1, /api/v1) segue interna.
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.services.gw-panel.loadbalancer.server.port=20128
      - traefik.http.routers.gw-panel.rule=Host(`gw.rangeltech.net`) && !PathPrefix(`/v1`) && !PathPrefix(`/api/v1`)
      - traefik.http.routers.gw-panel.entrypoints=websecure
      - traefik.http.routers.gw-panel.tls.certresolver=letsencrypt
      - traefik.http.routers.gw-panel.middlewares=security-headers@file,gw-rl
      - traefik.http.routers.gw-panel.service=gw-panel
      - traefik.http.middlewares.gw-rl.ratelimit.average=30
      - traefik.http.middlewares.gw-rl.ratelimit.burst=60
networks:
  internal:
    external: true
  public:
    external: true
  harness_llm:
    external: true
    name: kernel-harness-llm
