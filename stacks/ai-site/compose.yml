# Site de vendas de Lucas Rangel (spec_instagram): nginx estatico, imagem por release do repo ai_site.
# Camada B. Deploy: workflow deploy.yml (service=ai-site).
name: ai-site
services:
  web:
    image: ${AI_SITE_IMAGE:?imagem definida pelo scripts/deploy.sh a partir de releases/ai-site.lock}
    container_name: ai-site
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 64m
    cpus: 0.25
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [public]
    labels:
      - rt.service=ai-site
      - rt.layer=B
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.services.ai-site.loadbalancer.server.port=8080
      - traefik.http.routers.ai-site.rule=Host(`ai.rangeltech.net`)
      - traefik.http.routers.ai-site.entrypoints=websecure
      - traefik.http.routers.ai-site.tls.certresolver=letsencrypt
      - traefik.http.routers.ai-site.middlewares=security-headers@file
      - traefik.http.routers.ai-site.service=ai-site
networks:
  public:
    external: true
