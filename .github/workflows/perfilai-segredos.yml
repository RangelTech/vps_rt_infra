name: Perfilai segredos
# Grava NA VPS /opt/platform/secrets/perfilai.env (chave do llm-access, segredo de sessao, SMTP, Cakto) e cria a pasta de dados.
# Valores vem de secrets do ambiente `production` (nunca no Git nem no log). Depois rodar o Deploy (service=perfilai).
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: perfilai-segredos
  cancel-in-progress: false
jobs:
  segredos:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH (chave so deste repo, host fixado)
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          cp host/known_hosts ~/.ssh/known_hosts
      - name: Gravar perfilai.env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PERFILAI_LLM_KEY: ${{ secrets.PERFILAI_LLM_KEY }}
          PERFILAI_SEGREDO_SESSAO: ${{ secrets.PERFILAI_SEGREDO_SESSAO }}
          PERFILAI_CAKTO_SEGREDO: ${{ secrets.PERFILAI_CAKTO_SEGREDO }}
          PERFILAI_CHECKOUT_MENSAL: ${{ vars.PERFILAI_CHECKOUT_MENSAL }}
          PERFILAI_ADMIN_KEY: ${{ secrets.PERFILAI_ADMIN_KEY }}
          PERFILAI_DEMO_SENHA: ${{ secrets.PERFILAI_DEMO_SENHA }}
        run: |
          test -n "$SMTP_PASSWORD" && test -n "$PERFILAI_LLM_KEY" && test -n "$PERFILAI_SEGREDO_SESSAO"
          {
            printf '%s\n' "$SMTP_PASSWORD" "$PERFILAI_LLM_KEY" "$PERFILAI_SEGREDO_SESSAO" "${PERFILAI_CAKTO_SEGREDO:-}" "${PERFILAI_CHECKOUT_MENSAL:-}" "${PERFILAI_ADMIN_KEY:-}" "${PERFILAI_DEMO_SENHA:-}"
            cat <<'SH'
          set -e
          f=/opt/platform/secrets/perfilai.env
          umask 077
          {
            echo 'SMTP_HOST=smtp.hostinger.com'
            echo 'SMTP_PORT=587'
            echo 'SMTP_USER=contato@rangeltech.net'
            echo 'PERFILAI_SMTP_FROM=Perfilaí <contato@rangeltech.net>'
            printf 'SMTP_PASSWORD=%s\n' "$PW"
            printf 'PERFILAI_LLM_KEY=%s\n' "$K"
            printf 'PERFILAI_SEGREDO_SESSAO=%s\n' "$SS"
            printf 'PERFILAI_CAKTO_SEGREDO=%s\n' "$CK"
            printf 'PERFILAI_CHECKOUT_MENSAL=%s\n' "$CH"
            printf 'PERFILAI_ADMIN_KEY=%s\n' "$AK"
            printf 'PERFILAI_DEMO_SENHA=%s\n' "$DS"
          } > "$f.tmp"
          mv "$f.tmp" "$f"
          chmod 600 "$f"
          mkdir -p /opt/platform/data/perfilai
          chown 10001:10001 /opt/platform/data/perfilai
          printf 'linhas: '; grep -c '=' "$f"
          SH
          } | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$VPS_DEPLOY_USER@$VPS_HOST" "sudo -n sh -c 'read -r PW; read -r K; read -r SS; read -r CK; read -r CH; read -r AK; read -r DS; export PW K SS CK CH AK DS; sh -s'"
