name: VPS diag

# Somente leitura, com timeout em cada comando: o que esta pesando no host (CPU, memoria, OOM, crash loops).
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Diagnostico profundo
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          echo "### host"; date; uptime; echo "cpus=$(nproc)"; free -m | sed -n 1,2p
          echo "### vmstat"; timeout 15 vmstat 1 4
          echo "### top por CPU"; timeout 15 ps -eo pid,ppid,stat,pcpu,pmem,etime,args --sort=-pcpu | head -16 | cut -c1-170
          echo "### containers com problema / reiniciando"
          timeout 60 sudo docker ps --filter status=restarting --format '{{.Names}} {{.Status}}' </dev/null
          timeout 60 sudo docker ps --filter health=unhealthy --format '{{.Names}} {{.Status}}' </dev/null
          echo "### processos airflow db check / healer"
          ps -eo pid,etime,args | grep -E 'airflow db check|compose-healer|docker compose' | grep -v grep | head -8 | cut -c1-170
          echo "### airflow: runs/tasks teste_senior mais recentes"
          timeout 60 sudo docker exec airflow-airflow-scheduler-1 sh -c 'ls -t /opt/airflow/logs/dag_id=teste_senior/run_id=*/task_id=*/attempt=*.log 2>/dev/null | head -3' </dev/null
          echo "### DAG carregada (retries / goto)"
          timeout 60 sudo docker exec airflow-airflow-scheduler-1 sh -c "grep -n -E 'retries|domcontentloaded|execution_timeout' /opt/airflow/dags/teste_senior.py" </dev/null
          EOS
