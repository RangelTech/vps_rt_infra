name: VPS diag

# Somente leitura, com timeout em cada comando: o que esta pesando no host (CPU, memoria, OOM, crash loops).
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Diagnostico profundo
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          echo "### host"; date; uptime
          echo "### postgres: dono da chave TLS e estado"
          ls -ln /opt/platform/configs/postgres-tls/ 2>&1 | head
          timeout 60 sudo docker ps -a --filter name=^postgres$ --format '{{.Names}} {{.Status}}' </dev/null
          echo "### postgres: log (erro)"
          timeout 60 sudo docker logs --tail 12 postgres 2>&1 </dev/null | cut -c1-260
          echo "### synapse: log (erro)"
          timeout 60 sudo docker logs --tail 12 synapse 2>&1 </dev/null | cut -c1-260
          echo "### chatwoot-worker: primeira linha de erro"
          timeout 60 sudo docker logs --tail 400 chatwoot-worker 2>&1 </dev/null | grep -v -E '^/(usr|gems)|^\s+from ' | tail -12 | cut -c1-260
          echo "### compose projects"
          timeout 40 sudo docker inspect -f '{{.Name}} {{index .Config.Labels "com.docker.compose.project"}} {{index .Config.Labels "com.docker.compose.project.working_dir"}}' postgres synapse chatwoot-worker </dev/null 2>&1 | cut -c1-200
          EOS
