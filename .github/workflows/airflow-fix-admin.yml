name: Airflow fix admin

# Alinha a senha do usuario admin do Airflow (banco) com AIRFLOW_ADMIN_PASSWORD do /opt/airflow/.env (a que o deploy
# gerou). Tudo no servidor; nenhuma senha e impressa. Depois da execucao, testa-se a senha do cofre contra a API.
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Resetar senha do admin
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          echo "### antes"; date; uptime
          P=$(sudo grep -m1 '^AIRFLOW_ADMIN_PASSWORD=' /opt/airflow/.env | cut -d= -f2-)
          if [ -z "$P" ]; then echo "AIRFLOW_ADMIN_PASSWORD nao encontrado no .env do servidor"; exit 0; fi
          echo "senha no .env do servidor: len=${#P}"
          echo "### usuarios (so nomes)"
          timeout 120 sudo docker exec airflow-airflow-scheduler-1 airflow users list </dev/null 2>&1 | tail -4 | cut -c1-160
          echo "### reset"
          timeout 120 sudo docker exec airflow-airflow-scheduler-1 airflow users reset-password -u admin -p "$P" </dev/null 2>&1 | tail -2 | cut -c1-160
          echo "### auth da API usa basic_auth?"
          timeout 60 sudo docker exec airflow-airflow-scheduler-1 sh -c 'airflow config get-value api auth_backends' </dev/null 2>&1 | tail -1 | cut -c1-200
          EOS
