name: Deploy Airflow

# Sobe o Airflow pessoal (airflow.rangeltech.net) como projeto Compose proprio (airflow), atras do Traefik
# existente. As DAGs e os cookies do Playwright vivem em airflow/dags/ e sao sincronizados a cada push.
# Nao toca em /opt/platform nem em nenhum outro projeto.

on:
  workflow_dispatch:
    inputs:
      rodar_teste:
        description: "Dispara uma run real da DAG teste_senior (sem pausa) e anexa o print"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "airflow/**"
      - ".github/workflows/deploy-airflow.yml"

concurrency:
  group: deploy-airflow
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync the Compose project and DAGs
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo mkdir -p /opt/airflow-infra && sudo chown -R ${{ secrets.VPS_DEPLOY_USER }}:${{ secrets.VPS_DEPLOY_USER }} /opt/airflow-infra"
          rsync -az --delete -e "ssh -i ~/.ssh/vps_rt_infra_ed25519" airflow/ \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}:/opt/airflow-infra/"

      - name: Deploy
        run: |
          printf '%s' "${{ secrets.AIRFLOW_ADMIN_PASSWORD }}" | ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            'chmod +x /opt/airflow-infra/deploy.sh && AIRFLOW_ADMIN_PASSWORD="$(cat)" /opt/airflow-infra/deploy.sh'

      - name: Smoke test
        run: |
          for attempt in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://airflow.rangeltech.net/health || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -sf https://airflow.rangeltech.net/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['metadatabase']['status']=='healthy' and d['scheduler']['status']=='healthy', d; print(d)"

      - name: DAG import check and test run
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            C="docker compose --env-file /opt/airflow/.env -f /opt/airflow-infra/docker-compose.yml exec -T airflow-scheduler"
            $C airflow dags list-import-errors
            $C airflow dags list | grep teste_senior
            $C airflow dags next-execution teste_senior -n 6
            $C airflow dags details teste_senior | grep -i -E "timetable|start_date|catchup|timezone" || true
            $C airflow tasks test teste_senior eh_dia_util
            $C airflow tasks test teste_senior abrir_e_fechar
          '

      - name: Real test run of teste_senior (manual dispatch only)
        if: ${{ github.event.inputs.rodar_teste == 'true' }}
        run: |
          # `dags test` ignora o start_date (07/10/2026) e roda as 3 tasks de verdade; aparece na UI como run de teste.
          ssh -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          set -e
          D="docker compose --env-file /opt/airflow/.env -f /opt/airflow-infra/docker-compose.yml"
          dx() { $D exec -T airflow-scheduler "$@" </dev/null; }
          dx airflow dags test teste_senior -c '{"teste": true}' 2>&1 | grep -E "URL:|Titulo:|BOTAO|Run de teste|Sessao renovada|Estado inicializado|Condition|Marking task|Traceback|Error|Assertion" || true
          rm -rf /tmp/senior_shots && mkdir -p /tmp/senior_shots
          $D cp airflow-scheduler:/opt/airflow/logs/screenshots/senior_latest.png /tmp/senior_shots/senior_latest.png </dev/null
          EOS
          scp -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}:/tmp/senior_shots/senior_latest.png" ./senior_latest.png

      - name: Upload screenshot
        if: ${{ always() && github.event.inputs.rodar_teste == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: senior-print
          path: senior_latest.png
          if-no-files-found: warn
