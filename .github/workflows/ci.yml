name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck dos scripts de host
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S warning -x scripts/*.sh host/*.sh
      - name: python (release_intake)
        run: python3 -m py_compile scripts/release_intake.py
      - name: compose config por stack
        run: |
          for f in stacks/*/compose.yml; do
            echo "== $f"
            KERNEL_HARNESS_IMAGE=x docker compose -f "$f" config -q
          done
      - name: gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --no-git
