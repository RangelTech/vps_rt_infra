name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck dos scripts de host
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S warning -x scripts/*.sh host/*.sh
      - name: python (release_intake)
        run: python3 -m py_compile scripts/release_intake.py
      - name: compose config por stack
        run: |
          sudo mkdir -p /opt/platform/secrets
          for f in stacks/*/compose.yml; do
            echo "== $f"; d="$(dirname "$f")"
            # arquivos de segredo nao existem no runner: cria vazios so para o `config` validar o YAML
            grep -oE 'env_file: */opt/platform/secrets/[A-Za-z0-9_.-]+' "$f" | awk '{print $NF}' | sort -u | while read -r e; do sudo touch "$e"; done
            grep -oE 'env_file: *[A-Za-z0-9_.-]+\.env' "$f" | awk '{print $NF}' | sort -u | while read -r e; do touch "$d/$e"; done
            vars="$(grep -oE '\$\{[A-Z0-9_]+_IMAGE' "$f" | sed 's/^..//' | sort -u | sed 's/$/=x/' | tr '
' ' ')"
            # shellcheck disable=SC2086
            env $vars docker compose -f "$f" config -q
          done
      - name: gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --no-git
