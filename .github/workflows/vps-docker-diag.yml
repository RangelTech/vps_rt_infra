name: VPS docker diag

# Somente leitura e SEM chamar o docker (o daemon pode estar fora): systemd, journal e kernel.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Diagnostico sem docker
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          echo "### host"; date; uptime
          echo "### apt: o que foi atualizado hoje"
          timeout 20 sudo tail -n 40 /var/log/apt/history.log 2>&1 | cut -c1-300
          echo "### unattended-upgrades (log)"
          timeout 20 sudo tail -n 15 /var/log/unattended-upgrades/unattended-upgrades.log 2>&1 | cut -c1-250
          echo "### dpkg hoje (docker/kernel)"
          timeout 20 sudo grep -E "$(date +%Y-%m-%d)" /var/log/dpkg.log 2>/dev/null | grep -i -E 'docker|containerd|linux-image|runc' | tail -12 | cut -c1-200
          echo "### reboot pendente?"; ls -l /var/run/reboot-required 2>&1; cat /var/run/reboot-required.pkgs 2>/dev/null | head -5
          echo "### docker: ativo desde"; timeout 20 systemctl show docker -p ActiveEnterTimestamp -p NRestarts 2>&1
          echo "### timers de upgrade"; timeout 20 systemctl list-timers apt-daily.timer apt-daily-upgrade.timer --no-pager 2>&1 | head -5 | cut -c1-200
          EOS
