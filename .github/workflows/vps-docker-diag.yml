name: VPS docker diag

# Somente leitura, com timeout em tudo.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Diagnostico
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          echo "### host"; date; uptime
          echo "### contagem"; sudo timeout 60 docker ps -q </dev/null | wc -l | sed 's/^/rodando: /'
          echo "### traefik / pgbouncer / postgres / airflow web"
          sudo timeout 60 docker ps -a --filter name=traefik --filter name=pgbouncer --filter name=^postgres$ --filter name=airflow-airflow-webserver --filter name=site-portfolio --filter name=pncp-db-db --format '{{.Names}}\t{{.Status}}' </dev/null
          echo "### traefik: motivo"
          sudo timeout 30 docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}} restarts={{.RestartCount}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' traefik </dev/null 2>&1 | cut -c1-300
          sudo timeout 30 docker logs --tail 5 traefik 2>&1 </dev/null | cut -c1-240
          echo "### reiniciando agora / crash loop"
          sudo timeout 60 docker ps --filter status=restarting --format '{{.Names}}\t{{.Status}}' </dev/null
          echo "### mais reinicios (docker inspect)"
          sudo timeout 90 docker inspect -f '{{.Name}} restarts={{.RestartCount}} status={{.State.Status}}' $(sudo docker ps -aq </dev/null) </dev/null 2>/dev/null | sort -t= -k2 -n -r | head -6
          echo "### portas publicas"; ss -ltn 2>/dev/null | grep -E ':(80|443|5432|5433) ' | head -5
          EOS
