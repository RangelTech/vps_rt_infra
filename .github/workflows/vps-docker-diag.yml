name: VPS docker diag

# Somente leitura, com timeout em tudo.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Diagnostico
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          echo "### host"; date; uptime
          echo "### redes dos containers que o traefik ignora"
          for c in site-portfolio evolution-864f3da4dcae evolution-442fa1e33c6d airflow-airflow-webserver-1; do
            printf '%s: ' "$c"; timeout 30 sudo docker inspect -f '{{.State.Status}} redes={{range $k,$v := .NetworkSettings.Networks}}{{$k}}({{$v.IPAddress}}) {{end}}' "$c" </dev/null 2>&1 | cut -c1-200
          done
          echo "### rede public: membros"
          timeout 30 sudo docker network inspect public -f '{{range .Containers}}{{.Name}} {{end}}' </dev/null 2>&1 | cut -c1-700
          echo "### webserver airflow: health e logs"
          timeout 30 sudo docker inspect -f '{{.State.Health.Status}} failing={{.State.Health.FailingStreak}}' airflow-airflow-webserver-1 </dev/null 2>&1
          timeout 30 sudo docker inspect -f '{{range .State.Health.Log}}{{.ExitCode}} {{println .Output}}{{end}}' airflow-airflow-webserver-1 </dev/null 2>&1 | tail -4 | cut -c1-200
          timeout 40 sudo docker logs --tail 12 airflow-airflow-webserver-1 2>&1 </dev/null | cut -c1-240
          echo "### db do airflow"
          timeout 40 sudo docker logs --tail 5 airflow-airflow-db-1 2>&1 </dev/null | cut -c1-200
          timeout 40 sudo docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}' airflow-airflow-db-1 airflow-airflow-webserver-1 airflow-airflow-scheduler-1 </dev/null 2>&1
          echo "### mautrix-meta-facebook / infisical: por que nao sobem"
          timeout 40 sudo docker logs --tail 4 mautrix-meta-facebook 2>&1 </dev/null | cut -c1-240
          timeout 40 sudo docker inspect -f '{{.Name}} err={{.State.Error}}' mautrix-meta-facebook infisical </dev/null 2>&1 | cut -c1-300
          EOS
