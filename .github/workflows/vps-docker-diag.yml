name: VPS docker diag

# Somente leitura, com timeout em tudo.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Diagnostico sem docker
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          echo "### host"; date; uptime
          echo "### contagem de containers"
          timeout 60 sudo docker ps -q </dev/null | wc -l | sed 's/^/rodando: /'
          timeout 60 sudo docker ps -aq </dev/null | wc -l | sed 's/^/total: /'
          echo "### traefik / postgres / airflow / synapse"
          timeout 60 sudo docker ps -a --filter name=traefik --filter name=^postgres$ --filter name=airflow --filter name=synapse --filter name=pgbouncer --format '{{.Names}}	{{.Status}}' </dev/null
          echo "### traefik log (ultimas)"
          timeout 40 sudo docker logs --tail 15 traefik 2>&1 </dev/null | cut -c1-260
          echo "### containers parados que deveriam rodar (restart policy)"
          timeout 60 sudo docker ps -a --filter status=exited --filter status=created --format '{{.Names}}	{{.Status}}' </dev/null | grep -v -E 'weeks|public-demo' | head -20
          echo "### portas"; ss -ltn 2>/dev/null | grep -E ':(80|443|5432|5433) ' | head
          EOS
