name: Deploy Portfolio Site

# Builds the static export of the public repo lucas-rangel-portfolio at a
# pinned ref and publishes it to the site-portfolio container already
# declared in compose/docker-compose.yml (see the "Client static sites"
# section). This workflow never touches any other service.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit of LucasRangelSSouza/lucas-rangel-portfolio to deploy"
        required: true
        default: "v0.2.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the public site repo at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: LucasRangelSSouza/lucas-rangel-portfolio
          ref: ${{ github.event.inputs.ref }}
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the static export
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Publish the export to the VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/vps_rt_infra_ed25519" \
            site/out/ \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}:/opt/platform/sites/portfolio/public/"

      - name: Recreate only site-portfolio
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/platform/compose && docker compose up -d --no-deps site-portfolio"

      - name: Smoke test
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://rangeltech.net/")
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          echo "site-portfolio did not return 200"; exit 1
