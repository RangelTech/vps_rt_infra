name: backup-verify
# Prova semanal de que o backup restaura: pega o ultimo snapshot restic (Google Drive via rclone), restaura os dumps
# de chatwoot_prod e infisical num postgres:16 descartavel e confere contagens. Somente leitura no repositorio de backup.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: backup-verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    services:
      pg:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: verify
      MAX_AGE_HOURS: "26"
    steps:
      - name: Instalar rclone, restic e cliente postgres 16
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic rclone postgresql-client-16
      - name: Configurar rclone e restic (segredos nunca impressos)
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          RESTIC_ENV_B64: ${{ secrets.RESTIC_ENV_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/bk"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/bk/rclone.conf"
          printf '%s' "$RESTIC_ENV_B64" | base64 -d > "$RUNNER_TEMP/bk/restic.env"
          grep -q '^\[gdrive\]' "$RUNNER_TEMP/bk/rclone.conf" || { echo "rclone.conf sem remote gdrive"; exit 1; }
          echo "RCLONE_CONFIG=$RUNNER_TEMP/bk/rclone.conf" >> "$GITHUB_ENV"
          echo "RESTIC_ENV_FILE=$RUNNER_TEMP/bk/restic.env" >> "$GITHUB_ENV"
      - name: Idade do ultimo snapshot
        run: |
          set -euo pipefail
          set -a; . "$RESTIC_ENV_FILE"; set +a
          restic snapshots --tag daily --host rt-vps --latest 1 --json > "$RUNNER_TEMP/bk/snap.json"
          python3 - "$RUNNER_TEMP/bk/snap.json" "$MAX_AGE_HOURS" <<'PY'
          import json, sys, datetime as d
          snaps = json.load(open(sys.argv[1]))
          if not snaps:
              sys.exit("nenhum snapshot daily encontrado")
          s = snaps[-1]
          t = d.datetime.fromisoformat(s["time"][:19]).replace(tzinfo=d.timezone.utc)
          age = (d.datetime.now(d.timezone.utc) - t).total_seconds() / 3600
          print(f"snapshot {s['short_id']} de {t.isoformat()} ({age:.1f}h)")
          if age >= float(sys.argv[2]):
              sys.exit(f"snapshot velho demais: {age:.1f}h >= {sys.argv[2]}h")
          PY
      - name: Restaurar dumps do ultimo snapshot
        run: |
          set -euo pipefail
          set -a; . "$RESTIC_ENV_FILE"; set +a
          mkdir -p "$RUNNER_TEMP/restore"
          restic restore latest --tag daily --host rt-vps --target "$RUNNER_TEMP/restore" \
            --include '**/staging/*/pg/*.chatwoot_prod.dump' --include '**/staging/*/pg/*.infisical.dump'
          find "$RUNNER_TEMP/restore" -name '*.dump' -printf '%f %s bytes\n'
      - name: pg_restore e contagens
        run: |
          set -euo pipefail
          check() { # arquivo-glob banco tabela
            f="$(find "$RUNNER_TEMP/restore" -name "$1" | sort | tail -n1)"
            [ -n "$f" ] || { echo "dump $1 ausente no snapshot"; return 1; }
            createdb "$2"
            pg_restore --no-owner --no-privileges -d "$2" "$f" 2> "$RUNNER_TEMP/$2.err" || { echo "pg_restore $2 falhou:"; head -n 20 "$RUNNER_TEMP/$2.err"; return 1; }
            n="$(psql -d "$2" -Atc "select count(*) from $3")"
            echo "$2.$3 = $n linhas"
            [ "$n" -gt 0 ] || { echo "$2.$3 vazio"; return 1; }
          }
          rc=0
          check '*.chatwoot_prod.dump' chatwoot_prod accounts || rc=1
          check '*.infisical.dump' infisical users || rc=1
          exit $rc
      - name: Limpar segredos
        if: always()
        run: rm -rf "$RUNNER_TEMP/bk" "$RUNNER_TEMP/restore"
      - name: Abrir ou atualizar issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='backup-verify falhou'
          body="Execucao: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} ($(date -u +%FT%TZ))"
          n="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
