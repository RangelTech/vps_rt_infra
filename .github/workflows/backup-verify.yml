name: backup-verify
# Prova semanal de que o backup restaura: pega o ultimo snapshot restic (Google Drive via rclone), restaura TODOS os dumps
# num postgres:16 descartavel, confere tabelas/indices/amcheck/contagens e valida os volumes (kernel, RM, workspaces). Somente leitura no repositorio de backup.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: backup-verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    services:
      pg:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: verify
      MAX_AGE_HOURS: "26"
    steps:
      - uses: actions/checkout@v4
      - name: Instalar rclone, restic e cliente postgres 16
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic rclone postgresql-client-16 python3
      - name: Configurar rclone e restic (segredos nunca impressos)
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          RESTIC_ENV_B64: ${{ secrets.RESTIC_ENV_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/bk"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/bk/rclone.conf"
          printf '%s' "$RESTIC_ENV_B64" | base64 -d > "$RUNNER_TEMP/bk/restic.env"
          grep -q '^\[gdrive\]' "$RUNNER_TEMP/bk/rclone.conf" || { echo "rclone.conf sem remote gdrive"; exit 1; }
          echo "RCLONE_CONFIG=$RUNNER_TEMP/bk/rclone.conf" >> "$GITHUB_ENV"
          echo "RESTIC_ENV_FILE=$RUNNER_TEMP/bk/restic.env" >> "$GITHUB_ENV"
      - name: Prova de restauracao (dumps + volumes) com scripts/restore-verify.sh
        run: |
          set -euo pipefail
          WORKDIR_BASE="$RUNNER_TEMP" REPORT_JSON="$RUNNER_TEMP/restore_verify.json" bash scripts/restore-verify.sh | tee "$RUNNER_TEMP/rv.log"
          cat "$RUNNER_TEMP/restore_verify.json"
      - name: Limpar segredos
        if: always()
        run: rm -rf "$RUNNER_TEMP/bk" "$RUNNER_TEMP/restore"
      - name: Abrir ou atualizar issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='backup-verify falhou'
          body="Execucao: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} ($(date -u +%FT%TZ))"
          n="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
