name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "compose/**"
      - "configs/**"
      - "apps/**"
      - "cloud-init/**"
      - "scripts/**"
      - "sites/**"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Configure SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -upgrade

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_server_ip: ${{ secrets.VPS_HOST }}
          TF_VAR_initial_ssh_password: ${{ secrets.VPS_INITIAL_SSH_PASSWORD }}
          TF_VAR_public_ssh_key: ${{ secrets.VPS_PUBLIC_SSH_KEY }}
          TF_VAR_ssh_private_key_path: /home/runner/.ssh/vps_rt_infra_ed25519
          TF_VAR_hostinger_api_key: ${{ secrets.HOSTINGER_API_KEY }}
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_pgbouncer_admin_password: ${{ secrets.PGBOUNCER_ADMIN_PASSWORD }}
          TF_VAR_redis_password: ${{ secrets.REDIS_PASSWORD }}
          TF_VAR_minio_root_password: ${{ secrets.MINIO_ROOT_PASSWORD }}
          TF_VAR_pgadmin_password: ${{ secrets.PGADMIN_PASSWORD }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_uptime_kuma_password: ${{ secrets.UPTIME_KUMA_PASSWORD }}
          TF_VAR_traefik_basic_auth: ${{ secrets.TRAEFIK_BASIC_AUTH }}
          TF_VAR_code_server_password: ${{ secrets.CODE_SERVER_PASSWORD }}
          TF_VAR_code_server_sudo_password: ${{ secrets.CODE_SERVER_SUDO_PASSWORD }}
          TF_VAR_restic_repository: ${{ secrets.RESTIC_REPOSITORY }}
          TF_VAR_restic_password: ${{ secrets.RESTIC_PASSWORD }}
        run: terraform plan -no-color
