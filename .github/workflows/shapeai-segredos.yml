name: Shape AI segredos
# Grava NA VPS /opt/platform/secrets/shapeai.env (chave do llm-access, segredo de sessao, SMTP, Cakto) e cria a pasta de dados.
# Valores vem de secrets do ambiente `production` (nunca no Git nem no log). Depois rodar o Deploy (service=shapeai).
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: shapeai-segredos
  cancel-in-progress: false
jobs:
  segredos:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH (chave so deste repo, host fixado)
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          cp host/known_hosts ~/.ssh/known_hosts
      - name: Gravar shapeai.env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SHAPEAI_LLM_KEY: ${{ secrets.HERMES_PRODUTOS_KEY }}   # IA pelo Hermes dos produtos (16/11)
          SHAPEAI_SEGREDO_SESSAO: ${{ secrets.SHAPEAI_SEGREDO_SESSAO }}
          SHAPEAI_CAKTO_SEGREDO: ${{ secrets.SHAPEAI_CAKTO_SEGREDO }}
          SHAPEAI_ADMIN_KEY: ${{ secrets.SHAPEAI_ADMIN_KEY }}
          SHAPEAI_DEMO_SENHA: ${{ secrets.SHAPEAI_DEMO_SENHA }}
          SHAPEAI_VISAO_KEY: ${{ secrets.CORTAI_LLM_KEY }}   # visão do llm-access (foto da receita)
        run: |
          test -n "$SMTP_PASSWORD" && test -n "$SHAPEAI_LLM_KEY" && test -n "$SHAPEAI_SEGREDO_SESSAO"
          {
            printf '%s\n' "$SMTP_PASSWORD" "$SHAPEAI_LLM_KEY" "$SHAPEAI_SEGREDO_SESSAO" "${SHAPEAI_CAKTO_SEGREDO:-}" "${SHAPEAI_ADMIN_KEY:-}" "${SHAPEAI_DEMO_SENHA:-}" "${SHAPEAI_VISAO_KEY:-}"
            cat <<'SH'
          set -e
          f=/opt/platform/secrets/shapeai.env
          umask 077
          {
            echo 'SMTP_HOST=smtp.hostinger.com'
            echo 'SMTP_PORT=587'
            echo 'SMTP_USER=contato@rangeltech.net'
            echo 'SHAPEAI_SMTP_FROM=Shape AI <contato@rangeltech.net>'
            printf 'SMTP_PASSWORD=%s\n' "$PW"
            printf 'SHAPEAI_LLM_KEY=%s\n' "$K"
            printf 'SHAPEAI_SEGREDO_SESSAO=%s\n' "$SS"
            printf 'SHAPEAI_CAKTO_SEGREDO=%s\n' "$CK"
            printf 'SHAPEAI_ADMIN_KEY=%s\n' "$AK"
            printf 'SHAPEAI_DEMO_SENHA=%s\n' "$DS"
            printf 'SHAPEAI_VISAO_KEY=%s
' "$VK"
          } > "$f.tmp"
          mv "$f.tmp" "$f"
          chmod 600 "$f"
          mkdir -p /opt/platform/data/shapeai
          chown 10001:10001 /opt/platform/data/shapeai
          printf 'linhas: '; grep -c '=' "$f"
          SH
          } | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$VPS_DEPLOY_USER@$VPS_HOST" "sudo -n sh -c 'read -r PW; read -r K; read -r SS; read -r CK; read -r AK; read -r DS; read -r VK; export PW K SS CK AK DS VK; sh -s'"
