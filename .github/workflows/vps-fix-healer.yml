name: VPS fix healer

# Troca o script do rt-compose-healer por uma versao que checa o estado com UMA chamada ao Docker (a antiga fazia
# compose ps + inspect por servico e mantinha o host sobrecarregado). Dry-run antes de instalar; backup do antigo;
# troca atomica (mv). Nao toca em containers nem volumes.
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Enviar script
        run: |
          scp -o ConnectTimeout=20 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 scripts/compose-healer.sh "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}:/tmp/compose-healer.new"

      - name: Dry-run e instalar
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          set -u
          echo "### antes"; date; uptime; systemctl list-timers rt-compose-healer.timer --no-pager 2>&1 | head -3
          sudo bash -n /tmp/compose-healer.new && echo "sintaxe ok"
          echo "### dry-run da logica nova"
          START=$(date +%s)
          OUT=$(sudo env RT_HEALER_DRYRUN=1 RT_COMPOSE_HEALER_LOCK=/run/rt-compose-healer-dry.lock RT_COMPOSE_HEALER_LOG_TAG=rt-healer-dry timeout 240 bash /tmp/compose-healer.new 2>&1 </dev/null)
          echo "$OUT" | cut -c1-300
          echo "duracao: $(( $(date +%s) - START ))s"
          if echo "$OUT" | grep -q 'stack healthy'; then OK=1
          else
            N=$(echo "$OUT" | grep 'non-running services' | sed 's/.*non-running services: //' | wc -w)
            [ "${N:-99}" -le 3 ] && OK=1 || OK=0
          fi
          if [ "$OK" != 1 ]; then echo "ABORTADO: resultado do dry-run incoerente; nada instalado"; exit 1; fi
          echo "### instalando (backup + mv atomico)"
          sudo cp -a /usr/local/sbin/rt-compose-healer /usr/local/sbin/rt-compose-healer.bak-20261016
          sudo install -m 0755 /tmp/compose-healer.new /usr/local/sbin/.rt-compose-healer.tmp
          sudo mv -f /usr/local/sbin/.rt-compose-healer.tmp /usr/local/sbin/rt-compose-healer
          ls -l /usr/local/sbin/rt-compose-healer*
          echo "### load"; uptime
          EOS
