name: VPS restart docker

# Reinicia o daemon do Docker para reconciliar registros de containers "fantasma" (processo morto, estado velho) e liga
# live-restore para que upgrades/reinicios futuros do daemon NAO derrubem os containers. Pausa o healer durante a janela
# (/opt/platform/.maintenance), espera os containers voltarem pela restart policy, da `docker start` nos que ficarem
# parados e testa as rotas. Nao apaga volumes.
on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Reiniciar docker e verificar
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=90 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          echo "### antes"; date; uptime
          sudo timeout 60 docker ps --format '{{.Names}}' </dev/null | sort > /tmp/antes.txt; wc -l < /tmp/antes.txt | sed 's/^/containers rodando (registro): /'
          echo "### pausar healer"
          sudo touch /opt/platform/.maintenance
          echo "### live-restore"
          if [ -f /etc/docker/daemon.json ]; then echo "daemon.json existe:"; sudo cat /etc/docker/daemon.json | head -10
          else printf '{\n  "live-restore": true\n}\n' | sudo tee /etc/docker/daemon.json >/dev/null; echo "daemon.json criado com live-restore"; fi
          echo "### systemctl restart docker (em segundo plano)"
          sudo nohup sh -c 'systemctl restart docker' >/tmp/restart-docker.log 2>&1 &
          sleep 15
          for i in $(seq 1 90); do
            if sudo timeout 20 docker info >/dev/null 2>&1 </dev/null; then echo "$(date +%T) docker respondendo"; break; fi
            sleep 10
          done
          echo "### aguardando containers voltarem (restart policy)"
          for i in $(seq 1 60); do
            N=$(sudo timeout 40 docker ps -q </dev/null 2>/dev/null | wc -l)
            echo "$(date +%T) rodando=$N"
            [ "$N" -ge "$(wc -l < /tmp/antes.txt)" ] && break
            sleep 15
          done
          echo "### start nos que ficaram parados (exit 128/137 recentes)"
          for c in $(sudo timeout 60 docker ps -a --filter status=exited --format '{{.Names}}|{{.Status}}' </dev/null | grep -E 'Exited \((128|137|255)\)' | grep -E 'seconds|minutes? ago' | cut -d'|' -f1); do
            printf '%s: ' "$c"; sudo timeout 90 docker start "$c" </dev/null 2>&1 | tail -1 | cut -c1-120
          done
          sleep 20
          echo "### comparativo: estavam e nao estao"
          sudo timeout 60 docker ps --format '{{.Names}}' </dev/null | sort > /tmp/depois.txt
          comm -23 /tmp/antes.txt /tmp/depois.txt
          echo "(fim da lista)"
          echo "### orfaos / sem IP"
          sudo timeout 90 docker inspect -f '{{.Name}}|{{range $k,$v := .NetworkSettings.Networks}}{{$v.IPAddress}},{{end}}' $(sudo docker ps -q </dev/null) </dev/null 2>/dev/null | grep 'invalid IP' | cut -d'|' -f1
          echo "(fim)"
          echo "### liberar healer"
          sudo rm -f /opt/platform/.maintenance
          echo "### live-restore ativo?"
          sudo timeout 30 docker info --format 'live-restore={{.LiveRestoreEnabled}}' </dev/null 2>&1
          echo "### rotas locais"
          for h in lucas.rangeltech.net airflow.rangeltech.net rangeltech.net; do printf '%s -> ' "$h"; curl -sk -m 20 -o /dev/null -w '%{http_code}\n' --resolve $h:443:127.0.0.1 https://$h/; done
          uptime
          EOS
