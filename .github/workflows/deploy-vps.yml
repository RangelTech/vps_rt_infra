name: Deploy Stack Only

# Faster path than the full Terraform apply: just re-syncs compose/configs/apps
# and restarts the stack, without touching DNS, OS bootstrap or re-rendering
# compose/.env. Useful when only app code (9route) or a static config file
# changed. If you changed a *version* or *credential* Terraform variable, run
# "Terraform Apply" instead (or in addition) so compose/.env gets regenerated.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync stack to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/vps_rt_infra_ed25519" \
            compose/ configs/ apps/ scripts/ sites/ \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}:/opt/platform/" \
            --exclude ".env"
          rsync -az \
            -e "ssh -i ~/.ssh/vps_rt_infra_ed25519" \
            services.json \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}:/opt/platform/services.json"

      - name: Restart stack
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "chmod +x /opt/platform/scripts/*.sh && cd /opt/platform/compose && docker compose build ninerouter && docker compose up -d --remove-orphans"

      - name: Apply optional service flags (services.json)
        # Sem este passo, o atalho manual nunca aplicava as flags de
        # grafana/prometheus/loki/etc — só o Terraform Apply completo fazia
        # (gap encontrado e fechado em 17/08/2026, mega spec agent-llm).
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "RT_COMPOSE_DIR=/opt/platform/compose RT_SERVICES_JSON=/opt/platform/services.json /opt/platform/scripts/apply-services.sh"

      - name: Install compose self-healer
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo /opt/platform/scripts/install-compose-healer.sh"

      - name: Healthcheck
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "/opt/platform/scripts/healthcheck.sh" || true
