name: Deploy Stack Only

# Faster path than the full Terraform apply: just re-syncs compose/configs/apps
# and restarts the stack, without touching DNS or OS bootstrap. Useful when only
# the 9route image or a config file changed.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync stack to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/vps_rt_infra_ed25519" \
            compose/ configs/ apps/ scripts/ \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}:/opt/platform/" \
            --exclude ".env"

      - name: Restart stack
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/platform/compose && docker compose build ninerouter && docker compose up -d"
