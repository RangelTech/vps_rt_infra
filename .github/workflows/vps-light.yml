name: VPS light

# Somente leitura, sem chamar o docker: estado do systemd, carga e contagem de processos.
on:
  workflow_dispatch:

jobs:
  light:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Estado
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          date; uptime
          timeout 15 systemctl show docker -p ActiveState -p SubState -p ActiveEnterTimestamp 2>&1
          echo "shims: $(pgrep -c containerd-shim)  docker-proxy: $(pgrep -c docker-proxy)  runc: $(pgrep -c runc)"
          ps -eo pid,etime,pcpu,args --sort=-pcpu | head -6 | cut -c1-150
          ls -l /opt/platform/.maintenance 2>&1 | awk '{print $NF}'
          sudo tail -n 5 /var/log/syslog 2>/dev/null | cut -c1-200
          EOS
