name: Aluno TURN secret
# Gera NA VPS o segredo do coturn da area do aluno (/opt/platform/secrets/ai-aluno-turn.env), uma unica vez.
# O valor nunca passa pelo Git nem aparece no log: o workflow so confirma que a variavel existe.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: aluno-turn-secret
  cancel-in-progress: false
jobs:
  secret:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH (chave so deste repo, host fixado)
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          cp host/known_hosts ~/.ssh/known_hosts
      - name: Criar o segredo se nao existir
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
        run: |
          cat > remote.sh <<'SH'
          set -e
          mkdir -p /opt/platform/secrets
          f=/opt/platform/secrets/ai-aluno-turn.env
          if ! grep -q '^TURN_SECRET=' "$f" 2>/dev/null; then
            umask 077
            printf 'TURN_SECRET=%s\n' "$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" >> "$f"
            echo criado
          else
            echo ja-existia
          fi
          chmod 600 "$f"
          printf 'linhas TURN_SECRET: '; grep -c '^TURN_SECRET=' "$f"
          SH
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$VPS_DEPLOY_USER@$VPS_HOST" "sudo -n sh -s" < remote.sh
