name: VPS fix synapse

# Correcao pontual e sem perda de dados: o Synapse roda como uid 991 e os arquivos de /opt/platform/data/synapse
# (signing key, media_store) estao com dono 1001, entao ele nao le a chave e reinicia em loop. So muda dono (chown),
# nao apaga nem move nada. Depois lista o estado geral dos containers.
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Corrigir e verificar
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          set -u
          D=/opt/platform/data/synapse
          echo "### antes"; date; uptime; ls -ln $D; du -sh $D 2>/dev/null
          sudo chown -R 991:991 $D
          echo "### depois"; ls -ln $D
          echo "### start do synapse"
          timeout 120 sudo docker start synapse </dev/null || echo "start falhou"
          for i in $(seq 1 18); do
            S=$(timeout 30 sudo docker inspect -f '{{.State.Status}} restarts={{.RestartCount}}' synapse </dev/null 2>&1)
            echo "$(date +%T) synapse: $S"
            sleep 10
          done
          echo "### synapse log"; timeout 30 sudo docker logs --tail 6 synapse 2>&1 </dev/null | cut -c1-250
          echo "### containers fora do normal"
          timeout 40 sudo docker ps -a --filter status=restarting --filter status=exited --filter health=unhealthy --format '{{.Names}}\t{{.Status}}' </dev/null
          echo "### chatwoot-worker"; timeout 30 sudo docker ps --filter name=chatwoot-worker --format '{{.Names}} {{.Status}}' </dev/null
          echo "### load"; uptime; ps -eo stat | grep -c Z | sed 's/^/zumbis: /'
          EOS
