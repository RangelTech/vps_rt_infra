name: Atende AI segredos
# Grava NA VPS /opt/platform/secrets/atendeai.env (chave do llm-access, segredo de sessao, SMTP, Cakto) e cria a pasta de dados.
# Valores vem de secrets do ambiente `production` (nunca no Git nem no log). Depois rodar o Deploy (service=atendeai).
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: atendeai-segredos
  cancel-in-progress: false
jobs:
  segredos:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH (chave so deste repo, host fixado)
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          cp host/known_hosts ~/.ssh/known_hosts
      - name: Gravar atendeai.env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ATENDEAI_LLM_KEY: ${{ secrets.HERMES_PRODUTOS_KEY }}   # a IA do Atende passa pelo Hermes dos produtos (16/11)
          ATENDEAI_SEGREDO_SESSAO: ${{ secrets.ATENDEAI_SEGREDO_SESSAO }}
          ATENDEAI_CAKTO_SEGREDO: ${{ secrets.ATENDEAI_CAKTO_SEGREDO }}
          ATENDEAI_CANAIS_TOKEN: ${{ secrets.ATENDEAI_CANAIS_TOKEN }}
          ATENDEAI_ADMIN_KEY: ${{ secrets.ATENDEAI_ADMIN_KEY }}
          ATENDEAI_DEMO_SENHA: ${{ secrets.ATENDEAI_DEMO_SENHA }}
          ATENDEAI_VOZ_TOKEN: ${{ secrets.RT_VOZ_TOKEN }}
        run: |
          test -n "$SMTP_PASSWORD" && test -n "$ATENDEAI_LLM_KEY" && test -n "$ATENDEAI_SEGREDO_SESSAO" && test -n "$ATENDEAI_CANAIS_TOKEN"
          {
            printf '%s\n' "$SMTP_PASSWORD" "$ATENDEAI_LLM_KEY" "$ATENDEAI_SEGREDO_SESSAO" "${ATENDEAI_CAKTO_SEGREDO:-}" "$ATENDEAI_CANAIS_TOKEN" "${ATENDEAI_ADMIN_KEY:-}" "${ATENDEAI_DEMO_SENHA:-}" "${ATENDEAI_VOZ_TOKEN:-}"
            cat <<'SH'
          set -e
          f=/opt/platform/secrets/atendeai.env
          umask 077
          {
            echo 'SMTP_HOST=smtp.hostinger.com'
            echo 'SMTP_PORT=587'
            echo 'SMTP_USER=contato@rangeltech.net'
            echo 'ATENDEAI_SMTP_FROM=Atende AI <contato@rangeltech.net>'
            printf 'SMTP_PASSWORD=%s\n' "$PW"
            echo 'ATENDEAI_LLM_BASE=http://rt-hermes-produtos:8642/v1'
            echo 'ATENDEAI_LLM_MODELO=hermes-produtos'
            printf 'ATENDEAI_LLM_KEY=%s\n' "$K"
            printf 'ATENDEAI_SEGREDO_SESSAO=%s\n' "$SS"
            printf 'ATENDEAI_CAKTO_SEGREDO=%s\n' "$CK"
            printf 'ATENDEAI_CANAIS_TOKEN=%s\n' "$CT"
            printf 'ATENDEAI_ADMIN_KEY=%s\n' "$AK"
            printf 'ATENDEAI_DEMO_SENHA=%s\n' "$DS"
            if [ -n "$VT" ]; then printf 'ATENDEAI_VOZ_TOKEN=%s\n' "$VT"; fi
          } > "$f.tmp"
          mv "$f.tmp" "$f"
          chmod 600 "$f"
          mkdir -p /opt/platform/data/atendeai
          chown 10001:10001 /opt/platform/data/atendeai
          printf 'linhas: '; grep -c '=' "$f"
          SH
          } | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$VPS_DEPLOY_USER@$VPS_HOST" "sudo -n sh -c 'read -r PW; read -r K; read -r SS; read -r CK; read -r CT; read -r AK; read -r DS; read -r VT; export PW K SS CK CT AK DS VT; sh -s'"
