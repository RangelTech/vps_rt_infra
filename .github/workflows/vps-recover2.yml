name: VPS recover 2

# (1) grava no compose/.env as variaveis do Matrix de forma atomica (cp -p + mv) e VERIFICA; valores lidos dos
# containers vivos, nunca impressos. (2) containers cujo `restart` nao reinicia de fato (PID igual, rede sem IP):
# kill/stop/start conferindo o PID e, se preciso, reconecta a rede. Nao apaga volumes.
on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Recuperar
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=60 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          echo "### antes"; date; uptime
          cd /opt/platform/compose || exit 1
          echo "### .env: dono, atributos"
          sudo ls -ln .env | awk '{print $1,$3,$4,$5}'; sudo lsattr .env 2>&1 | awk '{print $1}'
          img_tag() { sudo timeout 40 docker inspect -f '{{.Config.Image}}' "$1" </dev/null 2>/dev/null | sed 's/.*://'; }
          SYN=$(img_tag synapse); FB=$(img_tag mautrix-meta-facebook)
          MPW=$(sudo timeout 40 docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' matrix-postgres </dev/null 2>/dev/null | sed -n 's/^POSTGRES_PASSWORD=//p' | head -1)
          echo "tags: synapse=$SYN mautrix=$FB senha_matrix=len ${#MPW}"
          if [ -n "$SYN" ] && [ -n "$FB" ] && [ -n "$MPW" ] && ! printf '%s' "$MPW" | grep -q "'"; then
            MPWE=$(printf '%s' "$MPW" | sed 's/\$/$$/g')
            sudo cp -p .env .env.new
            for kv in "SYNAPSE_VERSION=$SYN" "MAUTRIX_META_VERSION=$FB"; do
              k=${kv%%=*}; sudo grep -q "^$k=" .env.new || printf "%s\n" "$kv" | sudo tee -a .env.new >/dev/null
            done
            sudo grep -q '^MATRIX_POSTGRES_PASSWORD=' .env.new || printf "MATRIX_POSTGRES_PASSWORD='%s'\n" "$MPWE" | sudo tee -a .env.new >/dev/null
            echo "novo: $(sudo wc -c < .env.new) bytes (antigo: $(sudo wc -c < .env))"
            sudo mv -f .env.new .env
          else echo "valores incompletos; .env nao alterado"; fi
          echo "vars matrix no .env agora: $(sudo grep -c -E '^(SYNAPSE_VERSION|MAUTRIX_META_VERSION|MATRIX_POSTGRES_PASSWORD)=' .env)"
          echo "### imagens que o compose resolve"
          timeout 120 sudo docker compose config 2>/dev/null </dev/null | grep -E 'image:.*(mautrix|synapse)' | head -4
          echo "### simulacao up -d (dry-run)"
          SIM=$(timeout 300 sudo docker compose up -d --remove-orphans --dry-run 2>&1 </dev/null | grep -v 'variable is not set')
          echo "$SIM" | sed 's/^ *//' | grep -v -E 'Running|Healthy|Waiting' | sort | uniq -c | sort -rn | head -20 | cut -c1-170
          echo "### ciclo nos containers que nao reiniciam de verdade"
          for c in site-portfolio pncp-db-db-1 chatwoot-worker evolution-864f3da4dcae evolution-442fa1e33c6d; do
            P0=$(sudo timeout 30 docker inspect -f '{{.State.Pid}}' "$c" </dev/null 2>/dev/null)
            sudo timeout 60 docker kill "$c" </dev/null >/dev/null 2>&1
            sudo timeout 90 docker stop -t 3 "$c" </dev/null >/dev/null 2>&1
            sudo timeout 90 docker start "$c" </dev/null >/dev/null 2>&1
            sleep 6
            P1=$(sudo timeout 30 docker inspect -f '{{.State.Pid}}' "$c" </dev/null 2>/dev/null)
            IPS=$(sudo timeout 30 docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$v.IPAddress}} {{end}}' "$c" </dev/null 2>/dev/null)
            echo "$c: pid $P0 -> $P1 ips=$IPS"
            case "$IPS" in *invalid*)
              for n in $(sudo timeout 30 docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$c" </dev/null 2>/dev/null); do
                sudo timeout 40 docker network disconnect -f "$n" "$c" </dev/null >/dev/null 2>&1
                sudo timeout 40 docker network connect "$n" "$c" </dev/null >/dev/null 2>&1
              done
              echo "  reconectado: $(sudo timeout 30 docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$v.IPAddress}} {{end}}' "$c" </dev/null 2>/dev/null)";;
            esac
          done
          echo "### depois"
          timeout 90 sudo docker ps -a --filter status=exited --filter status=restarting --format '{{.Names}}\t{{.Status}}' </dev/null | grep -v -E 'weeks|months|public-demo|airflow-init' | head -12
          uptime
          EOS
