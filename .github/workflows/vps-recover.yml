name: VPS recover

# Recupera containers "fantasma" (Docker diz running mas o containerd perdeu a task, rede sem IP) apos o upgrade do
# docker/containerd feito no meio da operacao. So restart (nao apaga volume/dado) e inspecao mascarada do .env.
on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Recuperar
        run: |
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=60 -o ConnectionAttempts=3 -i ~/.ssh/vps_rt_infra_ed25519 "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOS'
          echo "### antes"; date; uptime
          echo "### .env (mascarado) e imagens que o compose resolve"
          cd /opt/platform/compose
          sudo sed -E 's/=.*/=<mask>/' .env | tail -6
          printf 'ultimo byte do .env: '; sudo tail -c1 .env | od -An -c
          sudo grep -c -E '^(SYNAPSE_VERSION|MAUTRIX_META_VERSION|MATRIX_POSTGRES_PASSWORD)=' .env | sed 's/^/vars matrix no .env: /'
          timeout 120 sudo docker compose config 2>/dev/null </dev/null | grep -E 'image:.*(mautrix|synapse)' | head -4
          echo "### fantasmas: running com rede sem IP"
          GH=$(timeout 90 sudo docker inspect -f '{{.Name}}|{{.State.Running}}|{{range $k,$v := .NetworkSettings.Networks}}{{$v.IPAddress}},{{end}}' $(sudo docker ps -q </dev/null) </dev/null 2>/dev/null | grep 'invalid IP' | cut -d'|' -f1 | tr -d '/')
          echo "$GH"
          echo "### restart dos fantasmas (um a um)"
          for c in $GH; do
            printf '%s: ' "$c"
            if timeout 90 sudo docker restart -t 10 "$c" </dev/null >/dev/null 2>&1; then echo "restart ok"
            else
              timeout 60 sudo docker stop -t 1 "$c" </dev/null >/dev/null 2>&1
              timeout 90 sudo docker start "$c" </dev/null >/dev/null 2>&1 && echo "stop+start ok" || echo "FALHOU"
            fi
          done
          echo "### webserver do airflow"
          if timeout 90 sudo docker restart -t 10 airflow-airflow-webserver-1 </dev/null >/dev/null 2>&1; then echo "restart ok"
          else
            echo "restart falhou; recriando so o webserver"
            timeout 300 sudo docker compose --env-file /opt/airflow/.env -f /opt/airflow-infra/docker-compose.yml up -d --no-deps --force-recreate airflow-webserver </dev/null 2>&1 | tail -4 | cut -c1-200
          fi
          echo "### mautrix-facebook e infisical"
          for c in mautrix-meta-facebook infisical; do printf '%s: ' "$c"; timeout 90 sudo docker start "$c" </dev/null 2>&1 | tail -1 | cut -c1-160; done
          echo "### depois: estado"
          timeout 90 sudo docker ps -a --filter status=exited --filter status=restarting --format '{{.Names}}\t{{.Status}}' </dev/null | grep -v -E 'weeks|months|public-demo|airflow-init' | head -12
          timeout 90 sudo docker inspect -f '{{.Name}}|{{range $k,$v := .NetworkSettings.Networks}}{{$v.IPAddress}},{{end}}' $(sudo docker ps -q </dev/null) </dev/null 2>/dev/null | grep -c 'invalid IP' | sed 's/^/fantasmas restantes: /'
          timeout 60 sudo docker ps -q </dev/null | wc -l | sed 's/^/rodando: /'
          uptime
          EOS
