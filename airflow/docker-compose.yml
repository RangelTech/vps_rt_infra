# Airflow pessoal da RT. Projeto Compose separado da stack de producao: so o webserver entra na rede
# `public` (Traefik e a unica entrada); o banco fica numa rede interna propria.
# Segredos vivem em /opt/airflow/.env na VPS (gerado pelo deploy.sh, nunca versionado).
name: airflow

x-airflow-common: &airflow-common
  build: .
  image: rt-airflow:2.10.5
  env_file: /opt/airflow/.env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Sao_Paulo
    AIRFLOW__WEBSERVER__BASE_URL: https://airflow.rangeltech.net
    AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__WEBSERVER__WORKERS: "2"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
    # Sessao do Playwright que a DAG renova a cada visita (a copia em dags/ e so a semente).
    - airflow-state:/opt/airflow/state
  restart: unless-stopped

services:
  airflow-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks: [backend]

  airflow-init:
    <<: *airflow-common
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        (airflow users list | grep -qw admin ||
        airflow users create --role Admin --username admin --password "$$AIRFLOW_ADMIN_PASSWORD"
        --firstname Lucas --lastname Rangel --email lucas.rangel.s.souza@gmail.com)
    depends_on:
      airflow-db:
        condition: service_healthy
    mem_limit: 1g
    networks: [backend]

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    # Chromium precisa de /dev/shm maior que o default de 64 MB.
    shm_size: 1gb
    mem_limit: 2500m
    networks: [backend, egress]

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1500m
    networks: [backend, public]
    labels:
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.routers.airflow.rule=Host(`airflow.rangeltech.net`)
      - traefik.http.routers.airflow.entrypoints=websecure
      - traefik.http.routers.airflow.tls.certresolver=letsencrypt
      - traefik.http.routers.airflow.middlewares=security-headers@file
      - traefik.http.services.airflow.loadbalancer.server.port=8080

volumes:
  airflow-pgdata:
  airflow-logs:
  airflow-state:

networks:
  backend:
    internal: true
  egress: {}
  public:
    external: true
