name: Astral AI segredos
# Grava NA VPS /opt/platform/secrets/astralai.env (chave do llm-access, segredo de sessao, SMTP, Cakto) e cria a pasta de dados.
# Valores vem de secrets do ambiente `production` (nunca no Git nem no log). Depois rodar o Deploy (service=astralai).
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: astralai-segredos
  cancel-in-progress: false
jobs:
  segredos:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH (chave so deste repo, host fixado)
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          cp host/known_hosts ~/.ssh/known_hosts
      - name: Gravar astralai.env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ASTRALAI_LLM_KEY: ${{ secrets.HERMES_PRODUTOS_KEY }}   # IA pelo Hermes dos produtos (16/11)
          ASTRALAI_SEGREDO_SESSAO: ${{ secrets.ASTRALAI_SEGREDO_SESSAO }}
          ASTRALAI_CAKTO_SEGREDO: ${{ secrets.ASTRALAI_CAKTO_SEGREDO }}
          ASTRALAI_ADMIN_KEY: ${{ secrets.ASTRALAI_ADMIN_KEY }}
          ASTRALAI_DEMO_SENHA: ${{ secrets.ASTRALAI_DEMO_SENHA }}
        run: |
          test -n "$SMTP_PASSWORD" && test -n "$ASTRALAI_LLM_KEY" && test -n "$ASTRALAI_SEGREDO_SESSAO"
          {
            printf '%s\n' "$SMTP_PASSWORD" "$ASTRALAI_LLM_KEY" "$ASTRALAI_SEGREDO_SESSAO" "${ASTRALAI_CAKTO_SEGREDO:-}" "${ASTRALAI_ADMIN_KEY:-}" "${ASTRALAI_DEMO_SENHA:-}"
            cat <<'SH'
          set -e
          f=/opt/platform/secrets/astralai.env
          umask 077
          {
            echo 'SMTP_HOST=smtp.hostinger.com'
            echo 'SMTP_PORT=587'
            echo 'SMTP_USER=contato@rangeltech.net'
            echo 'ASTRALAI_SMTP_FROM=Astral AI <contato@rangeltech.net>'
            printf 'SMTP_PASSWORD=%s\n' "$PW"
            printf 'ASTRALAI_LLM_KEY=%s\n' "$K"
            printf 'ASTRALAI_SEGREDO_SESSAO=%s\n' "$SS"
            printf 'ASTRALAI_CAKTO_SEGREDO=%s\n' "$CK"
            printf 'ASTRALAI_ADMIN_KEY=%s\n' "$AK"
            printf 'ASTRALAI_DEMO_SENHA=%s\n' "$DS"
          } > "$f.tmp"
          mv "$f.tmp" "$f"
          chmod 600 "$f"
          mkdir -p /opt/platform/data/astralai
          chown 10001:10001 /opt/platform/data/astralai
          printf 'linhas: '; grep -c '=' "$f"
          SH
          } | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$VPS_DEPLOY_USER@$VPS_HOST" "sudo -n sh -c 'read -r PW; read -r K; read -r SS; read -r CK; read -r AK; read -r DS; export PW K SS CK AK DS; sh -s'"
