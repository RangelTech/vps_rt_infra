services:
  traefik:
    image: traefik:${TRAEFIK_VERSION}
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../configs/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ../data/traefik:/letsencrypt
    networks:
      - public
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${ROOT_DOMAIN}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=admin-auth@docker,security-headers@file
      - traefik.http.middlewares.admin-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}

  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      TZ: ${TIMEZONE}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:${PGBOUNCER_VERSION}
    container_name: pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_ADMIN_USER}
      DB_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 30
      ADMIN_USERS: ${PGBOUNCER_ADMIN_USER}
      AUTH_TYPE: plain
      AUTH_USER: ${POSTGRES_ADMIN_USER}
      AUTH_QUERY: SELECT usename, passwd FROM pg_shadow WHERE usename=$1
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    networks:
      - internal

  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ../data/redis:/data
    networks:
      - internal

  minio:
    image: quay.io/minio/minio:${MINIO_VERSION}
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: ${TIMEZONE}
    volumes:
      - ../data/minio:/data
    networks:
      - internal
      - public
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio-api.rule=Host(`storage.${ROOT_DOMAIN}`)
      - traefik.http.routers.minio-api.entrypoints=websecure
      - traefik.http.routers.minio-api.tls.certresolver=letsencrypt
      - traefik.http.routers.minio-api.middlewares=security-headers@file
      - traefik.http.services.minio-api.loadbalancer.server.port=9000
      - traefik.http.routers.minio-console.rule=Host(`minio-admin.${ROOT_DOMAIN}`)
      - traefik.http.routers.minio-console.entrypoints=websecure
      - traefik.http.routers.minio-console.tls.certresolver=letsencrypt
      - traefik.http.routers.minio-console.middlewares=admin-auth@docker,security-headers@file
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
      - traefik.http.middlewares.admin-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "Authorized access only"
    volumes:
      - ../data/pgadmin:/var/lib/pgadmin
    networks:
      - internal
      - public
    labels:
      - traefik.enable=true
      - traefik.http.routers.pgadmin.rule=Host(`pgadmin.${ROOT_DOMAIN}`)
      - traefik.http.routers.pgadmin.entrypoints=websecure
      - traefik.http.routers.pgadmin.tls.certresolver=letsencrypt
      - traefik.http.routers.pgadmin.middlewares=admin-auth@docker,security-headers@file
      - traefik.http.services.pgadmin.loadbalancer.server.port=80
      - traefik.http.middlewares.admin-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${ROOT_DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../data/grafana:/var/lib/grafana
      - ../configs/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - internal
      - public
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${ROOT_DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana.middlewares=security-headers@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_VERSION}
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ../data/uptime-kuma:/app/data
    networks:
      - public
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime.rule=Host(`uptime.${ROOT_DOMAIN}`)
      - traefik.http.routers.uptime.entrypoints=websecure
      - traefik.http.routers.uptime.tls.certresolver=letsencrypt
      - traefik.http.routers.uptime.middlewares=security-headers@file
      - traefik.http.services.uptime.loadbalancer.server.port=3001

  ninerouter:
    build:
      context: ../apps/9route
      dockerfile: Dockerfile
      args:
        NINEROUTER_PACKAGE: ${NINEROUTER_PACKAGE}
    container_name: ninerouter
    restart: unless-stopped
    environment:
      PORT: ${NINEROUTER_PORT}
      NINEROUTER_HOME: /data
      TZ: ${TIMEZONE}
    volumes:
      - ../data/9router:/data
    networks:
      - public
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.ninerouter.rule=Host(`9route.${ROOT_DOMAIN}`)
      - traefik.http.routers.ninerouter.entrypoints=websecure
      - traefik.http.routers.ninerouter.tls.certresolver=letsencrypt
      - traefik.http.routers.ninerouter.middlewares=security-headers@file
      - traefik.http.services.ninerouter.loadbalancer.server.port=${NINEROUTER_PORT}

networks:
  internal:
    driver: bridge
    internal: true
  public:
    driver: bridge
