  #     - traefik.http.routers.site-example.entrypoints=websecure
  #     - traefik.http.routers.site-example.tls.certresolver=letsencrypt
  #     - traefik.http.routers.site-example.middlewares=security-headers@file
  #     - traefik.http.services.site-example.loadbalancer.server.port=80

  # site-example2:                                          # mode B example
  #   image: nginx:alpine
  #   container_name: site-example2
  #   restart: unless-stopped
  #   volumes:
  #     - ../sites/example2/public:/usr/share/nginx/html:ro
  #   networks:
  #     - public
  #   labels:
  #     - traefik.enable=true
  #     - traefik.docker.network=public
  #     - traefik.http.routers.site-example2.rule=Host(`example2.${ROOT_DOMAIN}`)
  #     - traefik.http.routers.site-example2.entrypoints=websecure
  #     - traefik.http.routers.site-example2.tls.certresolver=letsencrypt
  #     - traefik.http.routers.site-example2.middlewares=security-headers@file
  #     - traefik.http.services.site-example2.loadbalancer.server.port=80

networks:
  internal:
    name: internal
    driver: bridge
    internal: true
  public:
    name: public
    driver: bridge
