services:
  traefik:
    image: traefik:${TRAEFIK_VERSION}
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "5432:5432"
      - "5433:5433"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../configs/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ../data/traefik:/letsencrypt
    networks:
      - public
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${ROOT_DOMAIN}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=admin-auth@docker,security-headers@file
      - traefik.http.middlewares.admin-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}

  postgres:
    # Achado 19/08/2026: este compose apontava para o postgres oficial puro
    # (mesmo bug de drift do achado 17/08 com o TLS) - a extensao vector
    # existia no catalogo (pg_extension, persistido no volume de dados) mas a
    # lib vector.so nao existe na imagem oficial, so em pgvector/pgvector.
    # Um docker compose up a partir deste arquivo recriava o container com a
    # imagem errada e quebrava RAG/memoria silenciosamente ate alguem tentar
    # usar embeddings (erro real: could not access file "$libdir/vector").
    # NAO trocar de volta para a imagem oficial - precisa ser a variante
    # pgvector, na mesma major version (16) do volume de dados existente.
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    # SSL exigido por quem conecta via porta pública direta (kernel no Cloud
    # Run, fora da VPS — ver postgres-direct acima). Achado em 17/08/2026: o
    # mount de /etc/postgres-tls e o `command` de SSL existiam ao vivo na VPS
    # mas nunca tinham sido commitados aqui — um `docker compose up` a partir
    # deste arquivo tirava o TLS do Postgres sem ninguém perceber. Certs já
    # existem em configs/postgres-tls/ (server.crt/server.key).
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgres-tls/server.crt
      - -c
      - ssl_key_file=/etc/postgres-tls/server.key
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      TZ: ${TIMEZONE}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
      - ../configs/postgres-tls:/etc/postgres-tls:ro
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      # Acesso direto (sem pgbouncer) pro kernel no Cloud Run — ver
      # comentário no entrypoint postgres-direct em configs/traefik/traefik.yml.
      - traefik.enable=true
      - traefik.tcp.routers.postgres-direct.rule=HostSNI(`*`)
      - traefik.tcp.routers.postgres-direct.entrypoints=postgres-direct
      - traefik.tcp.routers.postgres-direct.service=postgres-direct
      - traefik.tcp.services.postgres-direct.loadbalancer.server.port=5432

  pgbouncer:
    image: edoburu/pgbouncer:${PGBOUNCER_VERSION}
    container_name: pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_ADMIN_USER}
      DB_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 30
      ADMIN_USERS: ${PGBOUNCER_ADMIN_USER}
      AUTH_TYPE: plain
      AUTH_USER: ${POSTGRES_ADMIN_USER}
      AUTH_QUERY: SELECT usename, passwd FROM pg_shadow WHERE usename=$1
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    networks:
      - internal
      - public
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.pgbouncer.rule=HostSNI(`*`)
      - traefik.tcp.routers.pgbouncer.entrypoints=postgres
      - traefik.tcp.routers.pgbouncer.service=pgbouncer
      - traefik.tcp.services.pgbouncer.loadbalancer.server.port=5432

  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ../data/redis:/data
    networks:
      - internal

  minio:
    image: quay.io/minio/minio:${MINIO_VERSION}
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: ${TIMEZONE}
    volumes:
      - ../data/minio:/data
    networks:
      - internal
      - public
    labels:
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.routers.minio-api.rule=Host(`storage.${ROOT_DOMAIN}`)
      - traefik.http.routers.minio-api.entrypoints=websecure
      - traefik.http.routers.minio-api.tls.certresolver=letsencrypt
      - traefik.http.routers.minio-api.middlewares=security-headers@file
      - traefik.http.routers.minio-api.service=minio-api
      - traefik.http.services.minio-api.loadbalancer.server.port=9000
      - traefik.http.routers.minio-console.rule=Host(`minio-admin.${ROOT_DOMAIN}`)
      - traefik.http.routers.minio-console.entrypoints=websecure
      - traefik.http.routers.minio-console.tls.certresolver=letsencrypt
      - traefik.http.routers.minio-console.middlewares=admin-auth@docker,security-headers@file
      - traefik.http.routers.minio-console.service=minio-console
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
      - traefik.http.middlewares.admin-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    container_name: pgadmin
    restart: unless-stopped
    profiles: ["pgadmin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: '"Authorized access only"'
    volumes:
      - ../data/pgadmin:/var/lib/pgadmin
    networks:
      - internal
      - public
    labels:
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.routers.pgadmin.rule=Host(`pgadmin.${ROOT_DOMAIN}`)
      - traefik.http.routers.pgadmin.entrypoints=websecure
      - traefik.http.routers.pgadmin.tls.certresolver=letsencrypt
      - traefik.http.routers.pgadmin.middlewares=admin-auth@docker,security-headers@file
      - traefik.http.services.pgadmin.loadbalancer.server.port=80
      - traefik.http.middlewares.admin-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: unless-stopped
    profiles: ["grafana"]
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${ROOT_DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - ../data/grafana:/var/lib/grafana
      - ../configs/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - internal
      - public
    labels:
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.routers.grafana.rule=Host(`grafana.${ROOT_DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana.middlewares=security-headers@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_VERSION}
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ../data/uptime-kuma:/app/data
    networks:
      - public
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime.rule=Host(`uptime.${ROOT_DOMAIN}`)
      - traefik.http.routers.uptime.entrypoints=websecure
      - traefik.http.routers.uptime.tls.certresolver=letsencrypt
      - traefik.http.routers.uptime.middlewares=security-headers@file
      - traefik.http.services.uptime.loadbalancer.server.port=3001

  code-server:
    image: lscr.io/linuxserver/code-server:${CODE_SERVER_VERSION}
    container_name: code-server
    restart: unless-stopped
    profiles: ["code-server"]
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TIMEZONE}
      PASSWORD: ${CODE_SERVER_PASSWORD}
      SUDO_PASSWORD: ${CODE_SERVER_SUDO_PASSWORD}
      DEFAULT_WORKSPACE: /workspace
    volumes:
      - ../:/workspace
      - ../data/code-server:/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - public
    labels:
      - traefik.enable=true
      - traefik.http.routers.code-server.rule=Host(`code.${ROOT_DOMAIN}`)
      - traefik.http.routers.code-server.entrypoints=websecure
      - traefik.http.routers.code-server.tls.certresolver=letsencrypt
      - traefik.http.routers.code-server.middlewares=security-headers@file
      - traefik.http.services.code-server.loadbalancer.server.port=8443

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    restart: unless-stopped
    profiles: ["prometheus"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ../configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../data/prometheus:/prometheus
    networks:
      - internal
      - public
    labels:
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${ROOT_DOMAIN}`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls.certresolver=letsencrypt
      - traefik.http.routers.prometheus.middlewares=admin-auth@docker,security-headers@file
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
      - traefik.http.middlewares.admin-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}

  loki:
    image: grafana/loki:${LOKI_VERSION}
    container_name: loki
    restart: unless-stopped
    profiles: ["loki"]
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ../configs/loki/config.yml:/etc/loki/config.yml:ro
      - ../data/loki:/loki
    networks:
      - internal
      - public
    labels:
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.routers.loki.rule=Host(`logs.${ROOT_DOMAIN}`)
      - traefik.http.routers.loki.entrypoints=websecure
      - traefik.http.routers.loki.tls.certresolver=letsencrypt
      - traefik.http.routers.loki.middlewares=admin-auth@docker,security-headers@file
      - traefik.http.services.loki.loadbalancer.server.port=3100
      - traefik.http.middlewares.admin-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}

  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION}
    container_name: promtail
    restart: unless-stopped
    profiles: ["promtail"]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ../configs/promtail/config.yml:/etc/promtail/config.yml:ro
      - ../data/promtail:/tmp
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    container_name: node-exporter
    restart: unless-stopped
    profiles: ["node-exporter"]
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - internal

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION}
    container_name: cadvisor
    restart: unless-stopped
    profiles: ["cadvisor"]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - internal

  ## ---------------------------------------------------------------------
  ## Infisical (self-hosted secret manager) — infra-09
  ## Dedicated Postgres + Redis (isolated blast radius, NOT the shared
  ## platform postgres/redis above — infra-09 section 5/8). UI reachable at
  ## infisical.${ROOT_DOMAIN}; CI/services authenticate via Machine Identity
  ## (Universal Auth), never via the UI login.
  ## ---------------------------------------------------------------------

  infisical-postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: infisical-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: infisical
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD}
      TZ: ${TIMEZONE}
    volumes:
      - ../data/infisical-postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 10s
      timeout: 5s
      retries: 5

  infisical-redis:
    image: redis:${REDIS_VERSION}
    container_name: infisical-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${INFISICAL_REDIS_PASSWORD}
    volumes:
      - ../data/infisical-redis:/data
    networks:
      - internal

  infisical:
    image: infisical/infisical:${INFISICAL_VERSION}
    container_name: infisical
    restart: unless-stopped
    depends_on:
      infisical-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SITE_URL: https://infisical.${ROOT_DOMAIN}
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      # DB_CONNECTION_URI/REDIS_URL embed the password directly in a URL and
      # are NOT url-encoded here — Infisical's pg-connection-string parser
      # chokes on raw "@"/"#"/etc in the credential (found the hard way:
      # first deploy crash-looped on "Invalid URL" until INFISICAL_DB_PASSWORD/
      # INFISICAL_REDIS_PASSWORD were regenerated alphanumeric-only). Keep
      # those two GitHub secrets alphanumeric on any future rotation.
      DB_CONNECTION_URI: postgres://infisical:${INFISICAL_DB_PASSWORD}@infisical-postgres:5432/infisical
      REDIS_URL: redis://:${INFISICAL_REDIS_PASSWORD}@infisical-redis:6379
      TZ: ${TIMEZONE}
    networks:
      - internal
      - public
    labels:
      - traefik.enable=true
      - traefik.docker.network=public
      - traefik.http.routers.infisical.rule=Host(`infisical.${ROOT_DOMAIN}`)
      - traefik.http.routers.infisical.entrypoints=websecure
      - traefik.http.routers.infisical.tls.certresolver=letsencrypt
      # No extra basic-auth layer here (unlike pgadmin/prometheus/loki): those
      # services have weak/no built-in auth, whereas Infisical has full
      # project auth + MFA-capable login + Machine Identity (Universal Auth)
      # for CI. Stacking basic auth in front would block the CI client_id/
      # client_secret login flow at the proxy. Same reasoning as grafana above
      # (also no admin-auth middleware).
      - traefik.http.routers.infisical.middlewares=security-headers@file
      - traefik.http.services.infisical.loadbalancer.server.port=8080

  ## ---------------------------------------------------------------------
  ## Client static sites
  ## One nginx:alpine container per client, serving files from
  ## ../sites/<slug>/public. Two modes — see sites/README.md for the full
  ## onboarding runbook before copying a block for a new client:
  ##   A) client has their own domain -> Host(`their-domain.com`)
  ##   B) client has no domain yet    -> Host(`<slug>.${ROOT_DOMAIN}`)
  ##      (also add the subdomain to terraform/dns.tf in that case)
  ## ---------------------------------------------------------------------

  # site-example:                                          # mode A example
  #   image: nginx:alpine
  #   container_name: site-example
  #   restart: unless-stopped
  #   volumes:
  #     - ../sites/example/public:/usr/share/nginx/html:ro
  #   networks:
  #     - public
  #   labels:
