      hosts: [viralizai.rangeltech.net, viralizai.fael.rangeltech.net], cakto: [lucas, adriano],
      infisical: { projeto: rt-produtos, pasta: viralizai }, schema: viralizai, bucket: viralizai, kuma: viralizai, qa: rt-produtos/viralizai/qa }
