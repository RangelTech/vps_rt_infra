# Registro único de produtos (spec 57, §10A.1). FONTE ÚNICA: alimenta o painel (tabela plataforma.produtos), o Uptime Kuma,
# o DNS, a Traefik e o README mestre. Só nomes e caminhos: NUNCA um valor de segredo.
# Validar: py -3 scripts/registro/validar.py
versao: 1
atualizado: "2026-11-24"

contas_cakto:
  lucas:   { segredos: "cakto/lucas",   obs: "todos os produtos, inclusive a landing própria do Viralizaí" }
  adriano: { segredos: "cakto/adriano", obs: "Segundo Cérebro e o Viralizaí vendido pela landing do Fael" }

# Campos: id, nome, tipo (produto | variante | plataforma | em_preparo), servico (nome em releases/sources.json = container),
#         repositorio, hosts, cakto (conta), infisical (projeto/pasta), schema e bucket (alvo da migração, §8), kuma, qa (pasta do usuário de QA)
produtos:
