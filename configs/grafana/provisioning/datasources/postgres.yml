apiVersion: 1

datasources:
  - name: Postgres (platform)
    uid: postgres-platform
    type: postgres
    access: proxy
    url: pgbouncer:6432
    database: ${POSTGRES_DB}
    user: ${POSTGRES_ADMIN_USER}
    secureJsonData:
      password: ${POSTGRES_ADMIN_PASSWORD}
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false
